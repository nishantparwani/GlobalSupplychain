<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Global Chain AI</title>
  <meta name="description" content="AI agent that identifies and analyses disruption risk at the world's maritime chokepoints." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script>
    // theme before first paint (stored choice, else OS preference)
    (function () {
      var t = null;
      try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('gc-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script>
    if (window.tailwind) tailwind.config = { corePlugins: { preflight: true }, theme: { extend: { fontFamily: { sans: ['IBM Plex Sans', 'system-ui', 'Segoe UI', 'sans-serif'], mono: ['IBM Plex Mono', 'ui-monospace', 'Consolas', 'monospace'] } } } };
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #060A10; --bg-2: #09101A;
      --panel: #0D141F; --panel-2: #121B28; --panel-3: #182333;
      --line: rgba(148, 163, 184, 0.12); --line-2: rgba(148, 163, 184, 0.22);
      --ink: #E8EDF4; --ink-2: #A7B2C1; --muted: #707C8F;
      --accent: #4CC3EE; --accent-ink: #04131B; --accent-soft: rgba(76, 195, 238, 0.12);
      --crit: #F0545C; --crit-soft: rgba(240, 84, 92, 0.13);
      --elev: #F2A93B; --elev-soft: rgba(242, 169, 59, 0.13);
      --ok: #3CC583; --ok-soft: rgba(60, 197, 131, 0.13);
      --grid: rgba(148, 163, 184, 0.10); --axis: rgba(148, 163, 184, 0.28);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      --map-bg: #15191F;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #F2F4F7; --bg-2: #EBEEF2;
      --panel: #FFFFFF; --panel-2: #F6F8FA; --panel-3: #EDF1F5;
      --line: rgba(15, 23, 42, 0.09); --line-2: rgba(15, 23, 42, 0.17);
      --ink: #0C1420; --ink-2: #445163; --muted: #778396;
      --accent: #0B7AA6; --accent-ink: #FFFFFF; --accent-soft: rgba(11, 122, 166, 0.10);
      --crit: #D23A43; --crit-soft: rgba(210, 58, 67, 0.10);
      --elev: #B86E00; --elev-soft: rgba(214, 140, 20, 0.13);
      --ok: #1E8A55; --ok-soft: rgba(30, 138, 85, 0.10);
      --grid: rgba(15, 23, 42, 0.07); --axis: rgba(15, 23, 42, 0.22);
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
      --map-bg: #E4E7EB;
    }
    html, body { background: var(--bg); color: var(--ink); margin: 0; overflow-x: clip; }
    body { font-family: 'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; }
    .mono, .num { font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--accent-soft); }

    /* shell */
    .shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
    .side { position: sticky; top: 0; height: 100vh; background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 1200; }
    .side-scrim { display: none; }
    @media (max-width: 1023px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .side { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
      .side.open { transform: none; }
      .side-scrim.open { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 1150; }
    }
    .nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--panel-2); color: var(--ink); }
    .nav-item.on { background: var(--accent-soft); color: var(--ink); }
    .nav-item.on svg { color: var(--accent); }
    .nav-item svg { color: var(--muted); flex-shrink: 0; }
    .nav-badge { margin-left: auto; font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 1px 7px; border-radius: 999px; }

    .topbar { position: sticky; top: 0; z-index: 1100; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }

    /* surfaces */
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .panel-2 { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
    .panel-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .panel-title { font-size: 15px; font-weight: 600; color: var(--ink); }
    .panel-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
    .kicker { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .hair { border-color: var(--line); }
    .ink { color: var(--ink); } .ink-2 { color: var(--ink-2); } .muted { color: var(--muted); }

    /* status pills: colour always paired with a label */
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; line-height: 1; padding: 5px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .pill-crit { color: var(--crit); background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
    .pill-elev { color: var(--elev); background: var(--elev-soft); border-color: color-mix(in srgb, var(--elev) 35%, transparent); }
    .pill-ok { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
    .pill-neutral { color: var(--ink-2); background: transparent; border-color: var(--line-2); }
    .pill-accent { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-2); color: var(--ink); background: var(--panel-2); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
    .btn:hover:not(:disabled) { background: var(--panel-3); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 86%, white); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
    .btn-ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--ink); }
    .btn-sm { font-size: 12px; padding: 5px 10px; border-radius: 7px; }
    .chipbtn { font-size: 12.5px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); background: transparent; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    .chipbtn:hover { color: var(--ink); border-color: var(--axis); }
    .chipbtn.on { color: var(--ink); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
    .seg button { font-size: 12px; padding: 6px 12px; color: var(--ink-2); background: transparent; }
    .seg button.on { background: var(--panel-3); color: var(--ink); }
    .field { width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; font-size: 13.5px; padding: 9px 10px; outline: none; }
    .field:focus { border-color: var(--accent); }
    .label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .track { height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
    .track > span { display: block; height: 100%; border-radius: 3px; }
    .src { font-size: 12px; color: var(--muted); border-bottom: 1px solid transparent; }
    .src:hover { color: var(--ink); border-bottom-color: var(--line-2); }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .tbl td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl tbody tr:hover td { background: var(--panel-2); }
    .divide > * + * { border-top: 1px solid var(--line); }
    .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .fade-in { animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }

    /* chart tooltip */
    .tip { position: absolute; pointer-events: none; z-index: 20; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink); box-shadow: var(--shadow); white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
    .tip .t-k { color: var(--muted); }

    /* ticker */
    .ticker { height: 32px; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--bg-2); position: relative; }
    .ticker::before, .ticker::after { content: ''; position: absolute; top: 0; bottom: 0; width: 36px; z-index: 1; pointer-events: none; }
    .ticker::before { left: 0; background: linear-gradient(90deg, var(--bg-2), transparent); }
    .ticker::after { right: 0; background: linear-gradient(270deg, var(--bg-2), transparent); }
    .ticker-track { display: flex; width: max-content; height: 100%; align-items: center; animation: ticker-scroll var(--ticker-s, 120s) linear infinite; }
    .ticker:hover .ticker-track { animation-play-state: paused; }
    .ticker-item { display: inline-flex; align-items: baseline; gap: 7px; padding: 0 15px; font-size: 12px; white-space: nowrap; border-right: 1px solid var(--line); cursor: default; }
    .ticker-group { font-size: 10px; font-weight: 600; letter-spacing: .09em; color: var(--accent); padding: 0 10px 0 20px; white-space: nowrap; }
    @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { .ticker { overflow-x: auto; } .ticker-track { animation: none; } .cp-ring { animation: none !important; } }

    /* map */
    .leaflet-container { background: var(--map-bg) !important; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    .leaflet-control-zoom { border: 1px solid var(--line-2) !important; border-radius: 8px !important; overflow: hidden; box-shadow: none !important; }
    .leaflet-control-zoom a { background: var(--panel) !important; color: var(--ink-2) !important; border-bottom: 1px solid var(--line) !important; }
    .leaflet-control-attribution { background: color-mix(in srgb, var(--bg) 80%, transparent) !important; color: var(--muted) !important; font-size: 10px !important; }
    .leaflet-control-attribution a { color: var(--ink-2) !important; }
    .leaflet-tooltip.gc-tip { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 6px; font-size: 11.5px; font-weight: 500; padding: 4px 8px; box-shadow: none; }
    .leaflet-tooltip.gc-tip::before { display: none; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel) !important; color: var(--ink) !important; border: 1px solid var(--line-2); box-shadow: var(--shadow) !important; }
    .leaflet-popup-content { margin: 12px 14px !important; font-size: 12px; line-height: 1.5; }
    .leaflet-container a.leaflet-popup-close-button { color: var(--muted) !important; }
    .cp-mark { position: relative; width: 0; height: 0; }
    .cp-core { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1.5px currentColor; background: currentColor; }
    .cp-ring { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; }
    .cp-CRITICAL { color: var(--crit); } .cp-ELEVATED { color: var(--elev); } .cp-NORMAL { color: var(--ok); }
    .cp-CRITICAL .cp-ring { animation: pulse 1.8s ease-out infinite; }
    .cp-ELEVATED .cp-ring { animation: pulse 2.8s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.6); opacity: 0; } }
    .cp-label { position: absolute; left: 12px; top: -11px; white-space: nowrap; font-size: 11.5px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 7px; pointer-events: none; }
    .cp-label b { font-family: 'IBM Plex Mono', monospace; font-weight: 500; margin-left: 5px; }
    .cp-mark.left .cp-label { left: auto; right: 12px; }
    .cp-mark.sel .cp-core { box-shadow: 0 0 0 1.5px currentColor, 0 0 0 6px color-mix(in srgb, currentColor 30%, transparent); }
    .layer-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; padding: 3px 0; user-select: none; }
    .layer-row input { accent-color: var(--accent); }

    /* markdown in copilot */
    .md p { margin: 0 0 8px; }
    .md .md-h { color: var(--ink); font-weight: 600; margin: 12px 0 6px; font-size: 14px; }
    .md .md-h:first-child { margin-top: 0; }
    .md ul, .md ol { margin: 4px 0 10px; padding-left: 20px; }
    .md ul { list-style: disc; } .md ol { list-style: decimal; }
    .md li { margin: 3px 0; }
    .md code { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--panel-3); padding: 1px 5px; border-radius: 4px; }
    .md pre { font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); padding: 10px; border-radius: 8px; overflow-x: auto; }
    .md a { color: var(--accent); }
    .md strong { color: var(--ink); font-weight: 600; }
    .md table { border-collapse: collapse; margin: 6px 0 10px; font-size: 12px; }
    .md td, .md th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
    .md .md-gap { height: 4px; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; }
    #boot-error { display: none; max-width: 640px; margin: 96px auto; padding: 24px; border: 1px solid var(--crit); border-radius: 12px; font-size: 14px; color: var(--crit); background: var(--panel); line-height: 1.6; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // =====================================================================
    // CONFIG & HELPERS
    // =====================================================================
    const API_BASE = (() => {
      const { protocol, port } = window.location;
      if (protocol.startsWith('http') && port === '8000') return '';
      return 'http://localhost:8000';
    })();

    async function api(path, opts = {}, timeoutMs = 30000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(API_BASE + path, { ...opts, signal: ctrl.signal });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || data.detail || `HTTP ${res.status}`);
        return data;
      } finally {
        clearTimeout(timer);
      }
    }

    const STATUS = {
      CRITICAL: { label: 'Critical', pill: 'pill-crit', css: 'var(--crit)' },
      ELEVATED: { label: 'Elevated', pill: 'pill-elev', css: 'var(--elev)' },
      NORMAL:   { label: 'Normal',   pill: 'pill-ok',   css: 'var(--ok)' },
    };
    const statusFor = (r) => (r >= 8 ? 'CRITICAL' : r >= 5 ? 'ELEVATED' : 'NORMAL');
    const CHOKE_ORDER = ['HORMUZ', 'BAB_EL_MANDEB', 'SUEZ', 'PANAMA', 'MALACCA'];
    const SHORT = { SUEZ: 'Suez', HORMUZ: 'Hormuz', BAB_EL_MANDEB: 'Bab-el-Mandeb', PANAMA: 'Panama', MALACCA: 'Malacca', CAPE_OF_GOOD_HOPE: 'Cape of Good Hope' };
    const EVENT_LABEL = {
      MILITARY_CONFLICT: 'Military conflict', PIRACY: 'Piracy / armed robbery', DROUGHT_WEATHER: 'Drought / weather',
      STRIKE_LABOR: 'Labour action', GENERAL_ADVISORY: 'General advisory',
    };
    const titleCase = (s) => (s || '').toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
    const nodeName = (graph, id) => graph?.nodes.find((n) => n.id === id)?.name || SHORT[id] || titleCase(id);
    const fmtNum = (n, d = 0) => (typeof n === 'number' ? n.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d }) : '--');
    const pct = (x, d = 0) => (typeof x === 'number' ? `${x >= 0 ? '+' : '−'}${Math.abs(x * 100).toFixed(d)}%` : '--');
    const fmtPrice = (x) => (typeof x !== 'number' ? '--' : x >= 1000 ? x.toLocaleString('en-US', { maximumFractionDigits: 0 }) : x >= 100 ? x.toFixed(1) : x.toFixed(2));
    const sigmoid = (z) => 1 / (1 + Math.exp(-z));
    const fmtDate = (iso) => (iso ? new Date(iso + (iso.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '--');
    const shortDate = (iso) => (iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '');
    const relTime = (iso) => {
      if (!iso) return null;
      const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return `${Math.round(s / 60)} min ago`;
      if (s < 86400) return `${Math.round(s / 3600)} h ago`;
      return `${Math.round(s / 86400)} d ago`;
    };
    const clockTime = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null);
    const niceMax = (v) => {
      if (!(v > 0)) return 1;
      const p = Math.pow(10, Math.floor(Math.log10(v)));
      const m = v / p;
      return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => m <= s) || 10) * p;
    };

    // Minimal, safe markdown: escape everything first, then apply a small grammar.
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function inlineMd(s) {
      return s
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }
    function renderMarkdown(src) {
      const lines = escapeHtml(src || '').split('\n');
      let html = '', list = null, inCode = false, code = [], table = [];
      const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
      const flushTable = () => {
        if (!table.length) return;
        const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r));
        html += '<table>';
        rows.forEach((r, i) => {
          const cells = r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
          const tag = i === 0 ? 'th' : 'td';
          html += '<tr>' + cells.map((c) => `<${tag}>${inlineMd(c.trim())}</${tag}>`).join('') + '</tr>';
        });
        html += '</table>';
        table = [];
      };
      for (const raw of lines) {
        if (raw.trim().startsWith('```')) {
          flushTable();
          if (inCode) { html += `<pre>${code.join('\n')}</pre>`; code = []; inCode = false; }
          else { closeList(); inCode = true; }
          continue;
        }
        if (inCode) { code.push(raw); continue; }
        const line = raw.replace(/\s+$/, '');
        if (/^\s*\|.*\|\s*$/.test(line)) { closeList(); table.push(line); continue; }
        flushTable();
        let m;
        if ((m = line.match(/^#{1,4}\s+(.*)$/))) { closeList(); html += `<div class="md-h">${inlineMd(m[1])}</div>`; continue; }
        if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${inlineMd(m[1])}</li>`; continue; }
        if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${inlineMd(m[1])}</li>`; continue; }
        if (line.trim() === '') { closeList(); html += '<div class="md-gap"></div>'; continue; }
        closeList();
        html += `<p>${inlineMd(line)}</p>`;
      }
      flushTable();
      if (inCode) html += `<pre>${code.join('\n')}</pre>`;
      closeList();
      return html;
    }

      const ref = useRef(null);
      const toLocal = useCallback((evt) => {

        if (!r) return null;
        return { vx: ((evt.clientX - r.left) / r.width) * W, px: evt.clientX - r.left, py: evt.clientY - r.top, w: r.width, h: r.height };

      if (!q || typeof q.price !== 'number') return '--';
      const d = q.price >= 1000 ? 0 : q.price >= 10 ? 2 : 3;

    // =====================================================================
    // MAP
    // =====================================================================
    const SHIP_COLORS = {
      tanker: '#F87171', cargo: '#34D399', passenger: '#60A5FA', fishing: '#FBBF24', tug: '#A78BFA',
      military: '#F472B6', special: '#22D3EE', pleasure: '#E879F9', other: '#9CA3AF', unknown: '#6B7280',
    };
    const SHIP_LABEL = {
      tanker: 'Tanker', cargo: 'Cargo', passenger: 'Passenger', fishing: 'Fishing', tug: 'Tug / towing',
      military: 'Military', special: 'Special craft', pleasure: 'Pleasure', other: 'Other', unknown: 'Unknown',
    };
    const yesterdayUTC = () => new Date(Date.now() - 36 * 3600 * 1000).toISOString().slice(0, 10);
    const BASEMAPS = {
      auto: { label: 'Chart', make: (theme) => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${theme === 'light' ? 'Light' : 'Dark'}_Gray_Base/MapServer/tile/{z}/{y}/{x}`, { maxZoom: 16, attribution: 'Tiles &copy; Esri' }) },

      satellite: { label: 'Satellite', make: () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 17, attribution: 'Imagery &copy; Esri, Maxar' }) },
      nasa: { label: 'NASA today', make: () => L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${yesterdayUTC()}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`, { maxNativeZoom: 9, maxZoom: 12, attribution: 'NASA GIBS / VIIRS (daily)' }) },
    };
    const OVERLAYS = [
      ['ships', 'Live ships (AIS)'],
      ['traffic', 'Transits vs normal'],
      ['density', 'Shipping density (EU)'],
      ['seamarks', 'Sea marks'],
    ];
    const LABEL_LEFT = new Set(['SUEZ', 'PANAMA']);

    function shipPopup(v) {
      const row = (k, val) => (val === null || val === undefined || val === '' ? '' : `<div><span style="color:var(--muted)">${k}</span> ${escapeHtml(String(val))}</div>`);
      return `<div style="font-weight:600;font-size:13px;margin-bottom:4px">${escapeHtml(v.name || 'Unnamed vessel')}</div>`
        + row('Type', SHIP_LABEL[v.category] || v.category)
        + row('Speed', v.sog != null ? `${v.sog.toFixed(1)} kn` : null)
        + row('Course', v.cog != null ? `${Math.round(v.cog)}°` : null)
        + row('Status', v.nav_status)
        + row('Destination', v.destination)
        + row('MMSI', v.mmsi)
        + row('Last report', `${Math.round(v.age_s / 60)} min ago via ${v.source}`);
    }

    function MaritimeMap({ graph, chokes, routes, focus, onSelect, signals, online, theme, height = 560, labels = true, defaultShips = true, fitRoutes = true }) {
      const elRef = useRef(null);
      const mapRef = useRef(null);
      const layers = useRef({});
      const baseRef = useRef(null);
      const [base, setBase] = useState('auto');
      const [over, setOver] = useState({ ships: defaultShips, traffic: false, density: false, seamarks: false });
      const [panel, setPanel] = useState(false);
      const [ais, setAis] = useState(null);
      const [view, setView] = useState(0);

      useEffect(() => {
        if (!elRef.current || !window.L || mapRef.current) return;
        const map = L.map(elRef.current, { center: [18, 45], zoom: 2, minZoom: 2, maxZoom: 12, zoomControl: false, scrollWheelZoom: false, worldCopyJump: true });
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        layers.current.renderer = L.canvas({ padding: 0.3 });
        layers.current.density = L.tileLayer.wms('https://ows.emodnet-humanactivities.eu/wms', {
          layers: 'emodnet:vesseldensity_all', format: 'image/png', transparent: true, opacity: 0.8, attribution: 'Vessel density &copy; EMODnet',
        });
        layers.current.seamarks = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18, attribution: 'Sea marks &copy; OpenSeaMap' });
        layers.current.ports = L.layerGroup().addTo(map);
        layers.current.ships = L.layerGroup().addTo(map);
        layers.current.traffic = L.layerGroup().addTo(map);
        layers.current.routes = L.layerGroup().addTo(map);
        layers.current.chokes = L.layerGroup().addTo(map);
        map.on('click', () => map.scrollWheelZoom.enable());
        map.on('mouseout', () => map.scrollWheelZoom.disable());
        map.on('moveend', () => setView((n) => n + 1));
        mapRef.current = map;
        const t = setTimeout(() => map.invalidateSize(), 200);
        const ro = new ResizeObserver(() => map.invalidateSize());
        ro.observe(elRef.current);
        return () => { clearTimeout(t); ro.disconnect(); map.remove(); mapRef.current = null; };
      }, []);

      useEffect(() => {
        const map = mapRef.current;
        if (!map) return;
        if (baseRef.current) map.removeLayer(baseRef.current);
        baseRef.current = BASEMAPS[base].make(theme).addTo(map);
        baseRef.current.bringToBack();
      }, [base, theme]);

      useEffect(() => {
        const map = mapRef.current;
        if (!map) return;
        ['density', 'seamarks'].forEach((k) => {
          const lyr = layers.current[k];
          if (over[k] && !map.hasLayer(lyr)) lyr.addTo(map);
          if (!over[k] && map.hasLayer(lyr)) map.removeLayer(lyr);
        });
        if (!over.ships) { layers.current.ships.clearLayers(); setAis(null); }
        if (!over.traffic) layers.current.traffic.clearLayers();
      }, [over]);

      // live AIS: poll the backend for vessels inside the current view
      const fetchShips = useCallback(async () => {
        const map = mapRef.current;
        if (!map || online === false) return;
        const b = map.getBounds();
        const span = b.getEast() - b.getWest();
        const qs = span >= 350 ? '' : `bbox=${[b.getSouth(), Math.max(-180, b.getWest()), b.getNorth(), Math.min(180, b.getEast())].map((x) => x.toFixed(3)).join(',')}&`;
        try {
          const data = await api(`/api/vessels?${qs}limit=5000`, {}, 15000);
          setAis(data);
          if (data.tracked_total === 0) setTimeout(() => setView((n) => n + 1), 4000);
        } catch {}
      }, [online]);

      useEffect(() => {
        if (!over.ships) return;
        fetchShips();
        const t = setInterval(fetchShips, 15000);
        return () => clearInterval(t);
      }, [over.ships, fetchShips]);

      useEffect(() => {
        if (!over.ships) return;
        const t = setTimeout(fetchShips, 400);
        return () => clearTimeout(t);
      }, [view]); // eslint-disable-line

      useEffect(() => {
        const g = layers.current.ships;
        const map = mapRef.current;
        if (!g || !map || !over.ships) return;
        g.clearLayers();
        if (!ais) return;
        const renderer = layers.current.renderer;
        const zoom = map.getZoom();
        const lenDeg = 5 / Math.pow(2, zoom);
        const showVectors = zoom >= 5;
        ais.vessels.forEach((v) => {
          const col = SHIP_COLORS[v.category] || SHIP_COLORS.unknown;
          const moving = (v.sog || 0) >= 1 && v.cog != null;
          if (moving && showVectors) {
            const d = lenDeg * Math.min(1.6, 0.4 + v.sog / 15);
            const rad = (v.cog * Math.PI) / 180;
            const tip = [v.lat + d * Math.cos(rad), v.lng + (d * Math.sin(rad)) / Math.max(0.2, Math.cos((v.lat * Math.PI) / 180))];
            L.polyline([[v.lat, v.lng], tip], { renderer, color: col, weight: 1.2, opacity: 0.85, interactive: false }).addTo(g);
          }
          L.circleMarker([v.lat, v.lng], { renderer, radius: moving ? 2.6 : 2, color: col, weight: 0, fillColor: col, fillOpacity: moving ? 0.95 : 0.55 })
            .bindPopup(() => shipPopup(v), { maxWidth: 260 })
            .addTo(g);
        });
      }, [ais, over.ships]);

      // passage traffic bubbles (AIS transit counts vs normal)
      useEffect(() => {
        const g = layers.current.traffic;
        if (!g) return;
        g.clearLayers();
        if (!over.traffic || !signals) return;
        const idx = Object.fromEntries((graph?.nodes || []).map((n) => [n.id, n]));
        signals.chokepoints.forEach((c) => {
          const t = c.traffic, n = idx[c.id];
          if (!t || !n) return;
          const col = t.pct_vs_baseline <= -0.25 ? '#F0545C' : t.pct_vs_baseline <= -0.1 ? '#F2A93B' : '#3CC583';
          L.circleMarker([n.lat, n.lng], { radius: 8 + Math.sqrt(t.baseline_median) * 1.4, color: col, weight: 1, fillColor: col, fillOpacity: 0.06, interactive: false }).addTo(g);
          L.circleMarker([n.lat, n.lng], { radius: 8 + Math.sqrt(t.recent_7d_mean) * 1.4, color: col, weight: 1.5, fillColor: col, fillOpacity: 0.2, interactive: false }).addTo(g);
        });
      }, [signals, graph, over.traffic]);

      const fitted = useRef(false);
      useEffect(() => {
        const map = mapRef.current;
        if (!map || !graph || fitted.current || routes) return;
        fitted.current = true;
        map.fitBounds(L.latLngBounds(graph.nodes.map((n) => [n.lat, n.lng])), { padding: [30, 30] });
      }, [graph, routes]);

      useEffect(() => {
        const g = layers.current.ports;
        if (!g || !graph) return;
        g.clearLayers();
        graph.nodes.filter((n) => n.kind === 'PORT').forEach((n) => {
          L.circleMarker([n.lat, n.lng], { radius: 3.5, color: theme === 'light' ? '#445163' : '#A7B2C1', weight: 1.5, fillColor: theme === 'light' ? '#FFFFFF' : '#0D141F', fillOpacity: 1 })
            .bindTooltip(n.name, { className: 'gc-tip', direction: 'top', offset: [0, -4] }).addTo(g);
        });
      }, [graph, theme]);

      useEffect(() => {
        const g = layers.current.chokes;
        if (!g || !chokes) return;
        g.clearLayers();
        chokes.forEach((c) => {
          const html = `<div class="cp-mark cp-${c.status} ${LABEL_LEFT.has(c.id) ? 'left' : ''} ${focus === c.id ? 'sel' : ''}"><span class="cp-ring"></span><span class="cp-core"></span>`
            + (labels ? `<span class="cp-label">${escapeHtml(SHORT[c.id] || c.name)}<b>${c.effective_risk.toFixed(0)}</b></span>` : '') + '</div>';
          L.marker([c.lat, c.lng], { icon: L.divIcon({ html, className: '', iconSize: [0, 0] }), zIndexOffset: 1000, keyboard: true, title: `${c.name}: ${STATUS[c.status].label}` })
            .on('click', (e) => { L.DomEvent.stopPropagation(e); onSelect && onSelect(c.id); })
            .addTo(g);
        });
      }, [chokes, onSelect, focus, labels]);

      useEffect(() => {
        if (!focus || !mapRef.current || !chokes || routes) return;
        const c = chokes.find((x) => x.id === focus);
        if (c) mapRef.current.flyTo([c.lat, c.lng], 5, { duration: 0.8 });
      }, [focus, chokes, routes]);

      useEffect(() => {
        const g = layers.current.routes;
        const map = mapRef.current;
        if (!g || !map) return;
        g.clearLayers();
        if (!routes || !routes.safe_route) return;
        const safe = routes.safe_route.geometry;
        const direct = routes.commercial_route.geometry;
        const converged = routes.comparison.converged;
        if (!converged) {
          L.polyline(direct, { color: '#F2A93B', weight: 2.5, opacity: 0.95, dashArray: '7 7' })
            .bindTooltip('Fastest route', { className: 'gc-tip', sticky: true }).addTo(g);
        }
        L.polyline(safe, { color: '#4CC3EE', weight: 7, opacity: 0.18 }).addTo(g);
        L.polyline(safe, { color: '#4CC3EE', weight: 3, opacity: 1 })
          .bindTooltip(converged ? 'Recommended route' : 'Safest route', { className: 'gc-tip', sticky: true }).addTo(g);
        const idx = Object.fromEntries((graph?.nodes || []).map((n) => [n.id, n]));
        [routes.start, routes.end].forEach((id, i) => {
          const n = idx[id];
          if (!n) return;
          L.circleMarker([n.lat, n.lng], { radius: 6, color: '#4CC3EE', weight: 2.5, fillColor: theme === 'light' ? '#FFFFFF' : '#060A10', fillOpacity: 1 })
            .bindTooltip(`${i === 0 ? 'From' : 'To'}: ${n.name}`, { className: 'gc-tip', permanent: true, direction: i === 0 ? 'left' : 'right', offset: [i === 0 ? -9 : 9, 0] })
            .addTo(g);
        });
        if (fitRoutes) {
          const bounds = L.latLngBounds([...safe, ...direct]);
          if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 4 });
        }
      }, [routes, graph, theme, fitRoutes]);

      const providers = ais ? Object.values(ais.providers) : [];
      const presentCats = ais ? Object.keys(SHIP_COLORS).filter((k) => ais.vessels.some((v) => v.category === k)) : [];

      return (
        <div className="relative overflow-hidden rounded-xl border hair" style={{ height }}>
          <div ref={elRef} className="absolute inset-0" />
          {!window.L && <div className="absolute inset-0 flex items-center justify-center text-sm muted">The map library failed to load.</div>}

          <div className="absolute right-3 top-3 z-[600] flex flex-col items-end gap-2">
            <button className="btn btn-sm" style={{ background: 'var(--panel)' }} onClick={() => setPanel((v) => !v)} aria-expanded={panel}><Icon name="layers" size={15} />Layers</button>
            {panel && (
              <div className="panel px-4 py-3 w-[232px] space-y-3 fade-in" style={{ boxShadow: 'var(--shadow)' }}>
                <div>
                  <div className="kicker mb-1.5">Base map</div>
                  <div className="flex flex-wrap gap-1">
                    {Object.entries(BASEMAPS).map(([k, b]) => (
                      <button key={k} onClick={() => setBase(k)} className={`chipbtn !py-1 !px-2.5 ${base === k ? 'on' : ''}`}>{b.label}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <div className="kicker mb-1">Layers</div>
                  {OVERLAYS.map(([k, label]) => (
                    <label key={k} className="layer-row">
                      <input type="checkbox" checked={over[k]} onChange={(e) => setOver((o) => ({ ...o, [k]: e.target.checked }))} />
                      <span>{label}</span>
                      {k === 'ships' && over.ships && ais && <span className="num muted ml-auto">{fmtNum(ais.in_view)}</span>}
                    </label>
                  ))}
                </div>
                {over.ships && ais && (
                  <div className="border-t hair pt-2 space-y-1">
                    {providers.map((p) => (
                      <div key={p.name} className="flex items-center gap-2 text-[11px] muted">
                        <span className="w-1.5 h-1.5 rounded-full" style={{ background: p.state === 'connected' || p.state === 'polling' ? 'var(--ok)' : p.state === 'no key' ? 'var(--muted)' : 'var(--elev)' }} />
                        <span className="truncate">{p.name}</span>
                        <span className="ml-auto">{p.state === 'no key' ? 'add key' : p.state}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          <div className="absolute left-3 bottom-3 z-[500] panel px-3.5 py-2.5 text-[11.5px] ink-2 space-y-1.5 pointer-events-none max-w-[calc(100%-70px)]" style={{ background: 'color-mix(in srgb, var(--panel) 92%, transparent)' }}>
            <div className="flex items-center gap-3 flex-wrap">
              {['CRITICAL', 'ELEVATED', 'NORMAL'].map((k) => (
                <span key={k} className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full" style={{ background: STATUS[k].css }} />{STATUS[k].label}</span>
              ))}
              {routes && <><span className="flex items-center gap-1.5"><span className="inline-block w-5 h-[3px] rounded" style={{ background: '#4CC3EE' }} />Safest</span>
                <span className="flex items-center gap-1.5"><span className="inline-block w-5 border-t-2 border-dashed" style={{ borderColor: '#F2A93B' }} />Fastest</span></>}
            </div>
            {over.ships && presentCats.length > 0 && (
              <div className="flex flex-wrap gap-x-3 gap-y-1 pt-1.5 border-t hair">
                {presentCats.slice(0, 6).map((k) => <span key={k} className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full" style={{ background: SHIP_COLORS[k] }} />{SHIP_LABEL[k]}</span>)}
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // CHARTS
    // =====================================================================
    // Daily transits: dots = daily count, line = 7-day mean, band = Holt 80% forecast interval.
    function TrafficChart({ t, height = 230 }) {
      const W = 760, H = height, m = { l: 40, r: 14, t: 14, b: 26 };
      const [ref, toLocal] = useSvgPointer(W);
      const [hover, setHover] = useState(null);
      const s = t.series, f = t.forecast;
      const n = s.length + f.length;
      const cp = t.change_point;
      const ymax = niceMax(Math.max(...s.map((p) => p.total), ...f.map((p) => p.hi), t.baseline_median, cp ? cp.before_mean : 0) * 1.05);
      const x = (i) => m.l + (i / (n - 1)) * (W - m.l - m.r);
      const y = (v) => H - m.b - (v / ymax) * (H - m.t - m.b);
      const ma = s.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.ma7).toFixed(1)}`).join('');
      const fx = (i) => x(s.length + i);
      const fMean = `M${x(s.length - 1).toFixed(1)},${y(s[s.length - 1].ma7).toFixed(1)}` + f.map((p, i) => `L${fx(i).toFixed(1)},${y(p.mean).toFixed(1)}`).join('');
      const band = f.map((p, i) => `${i ? 'L' : 'M'}${fx(i).toFixed(1)},${y(p.hi).toFixed(1)}`).join('')
        + [...f].reverse().map((p, j) => `L${fx(f.length - 1 - j).toFixed(1)},${y(p.lo).toFixed(1)}`).join('') + 'Z';
      const cpIdx = cp ? s.findIndex((p) => p.date >= cp.date) : -1;
      const months = s.map((p, i) => ({ i, d: p.date })).filter((p, k) => k === 0 || p.d.slice(5, 7) !== s[k - 1].date.slice(5, 7)).filter((p) => p.d.slice(8) <= '07');
      const onMove = (e) => {
        const p = toLocal(e);
        if (!p) return;
        const i = Math.round(((p.vx - m.l) / (W - m.l - m.r)) * (n - 1));
        if (i < 0 || i >= n) { setHover(null); return; }
        setHover({ i, px: p.px, py: Math.max(30, p.py) });
      };
      const hi = hover?.i;
      const hp = hi != null ? (hi < s.length ? { kind: 'obs', ...s[hi] } : { kind: 'fc', ...f[hi - s.length] }) : null;
      return (
        <div className="relative">
          <svg ref={ref} viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block" role="img" aria-label="Daily transits with 14-day forecast" onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
            {[0, 0.5, 1].map((g) => (
              <g key={g}>
                <line x1={m.l} x2={W - m.r} y1={y(ymax * g)} y2={y(ymax * g)} stroke="var(--grid)" />
                <text x={m.l - 8} y={y(ymax * g) + 4} textAnchor="end" fontSize="11" fill="var(--muted)" fontFamily="IBM Plex Mono">{Math.round(ymax * g)}</text>
              </g>
            ))}
            {months.map((mo) => <text key={mo.i} x={x(mo.i)} y={H - 6} fontSize="11" fill="var(--muted)">{new Date(mo.d + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short' })}</text>)}
            {cpIdx > 0 && (
              <g>
                <rect x={x(cpIdx)} y={m.t} width={x(s.length - 1) - x(cpIdx)} height={H - m.t - m.b} fill="var(--crit)" opacity="0.06" />
                <line x1={x(cpIdx)} x2={x(cpIdx)} y1={m.t} y2={H - m.b} stroke="var(--crit)" strokeWidth="1.2" />
                <text x={x(cpIdx) + 6} y={m.t + 12} fontSize="11" fill="var(--crit)" fontWeight="600">Level shift {shortDate(cp.date)}: {cp.before_mean.toFixed(0)} → {cp.after_mean.toFixed(0)}/day</text>
              </g>
            )}
            <line x1={m.l} x2={W - m.r} y1={y(t.baseline_median)} y2={y(t.baseline_median)} stroke="var(--ink-2)" strokeOpacity="0.55" />
            <text x={W - m.r} y={y(t.baseline_median) - 5} textAnchor="end" fontSize="11" fill="var(--ink-2)">normal {t.baseline_median.toFixed(0)}/day</text>
            {s.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.total)} r="1.3" fill="var(--muted)" opacity="0.55" />)}
            <path d={band} fill="var(--accent)" fillOpacity="0.12" />
            <path d={ma} fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinejoin="round" />
            <path d={fMean} fill="none" stroke="var(--accent)" strokeWidth="2" strokeDasharray="5 4" />
            <line x1={x(s.length - 1)} x2={x(s.length - 1)} y1={m.t} y2={H - m.b} stroke="var(--axis)" />
            <text x={x(s.length - 1) + 4} y={H - m.b - 6} fontSize="10.5" fill="var(--muted)">forecast</text>
            {hp && (
              <g>
                <line x1={x(hi)} x2={x(hi)} y1={m.t} y2={H - m.b} stroke="var(--axis)" />
                <circle cx={x(hi)} cy={y(hp.kind === 'obs' ? hp.ma7 : hp.mean)} r="4.5" fill="var(--accent)" stroke="var(--panel)" strokeWidth="2" />
              </g>
            )}
          </svg>
          {hp && (
            <div className="tip" style={{ left: hover.px, top: hover.py }}>
              {hp.kind === 'obs' ? (
                <><div className="font-medium">{fmtDate(hp.date)}</div>
                  <div><span className="t-k">Transits</span> <span className="num">{hp.total}</span></div>
                  <div><span className="t-k">7-day mean</span> <span className="num">{hp.ma7}</span></div></>
              ) : (
                <><div className="font-medium">Forecast +{hp.h} d</div>
                  <div><span className="t-k">Expected</span> <span className="num">{hp.mean.toFixed(1)}</span></div>
                  <div><span className="t-k">80% range</span> <span className="num">{hp.lo.toFixed(0)}–{hp.hi.toFixed(0)}</span></div></>
              )}
            </div>
          )}
        </div>
      );
    }

    // Naive-Bayes log-odds waterfall: each evidence source shifts the log-odds; the end is the posterior.
    function EvidenceWaterfall({ fusion }) {
      let cum = 0;
      const rows = fusion.evidence.map((e) => { const a = cum; cum += e.llr; return { ...e, a, b: cum }; });
      const vals = [0, ...rows.flatMap((r) => [r.a, r.b])];
      const lo = Math.min(...vals) - 0.3, hi = Math.max(...vals) + 0.3;
      const X = (v) => ((v - lo) / (hi - lo)) * 100;
      return (
        <div className="space-y-1">
          <div className="grid grid-cols-[minmax(120px,210px)_1fr_80px] gap-3 text-[11px] muted pb-1">
            <span>Evidence</span><span>Log-odds of disruption (each bar = one update)</span><span className="text-right">P after step</span>
          </div>
          {rows.map((r) => {
            const up = r.llr >= 0;
            const left = X(Math.min(r.a, r.b)), width = Math.max(0.8, Math.abs(X(r.b) - X(r.a)));
            return (
              <div key={r.source} className="grid grid-cols-[minmax(120px,210px)_1fr_80px] gap-3 items-center py-1.5 group" title={r.detail}>
                <div className="min-w-0">
                  <div className="text-[13px] ink truncate">{r.label}</div>
                  <div className="text-[11.5px] muted clamp2 leading-snug">{r.detail}</div>
                </div>
                <div className="relative h-[22px]">
                  <span className="absolute top-0 bottom-0 w-px" style={{ left: `${X(0)}%`, background: 'var(--axis)' }} />
                  <span className="absolute top-[5px] h-[12px] rounded-[4px]" style={{ left: `${left}%`, width: `${width}%`, background: r.source === 'prior' ? 'var(--ink-2)' : up ? 'var(--crit)' : 'var(--ok)', opacity: r.source === 'prior' ? 0.5 : 0.9 }} />
                  <span className="absolute top-[3px] text-[11px] num ink-2" style={{ left: `calc(${Math.max(X(r.a), X(r.b))}% + 6px)` }}>{r.llr >= 0 ? '+' : '−'}{Math.abs(r.llr).toFixed(2)}</span>
                </div>
                <div className="text-right num text-[13px] ink">{(sigmoid(r.b) * 100).toFixed(0)}%</div>
              </div>
            );
          })}
          <div className="grid grid-cols-[minmax(120px,210px)_1fr_80px] gap-3 items-center pt-2 mt-1 border-t hair">
            <div className="text-[13px] font-semibold ink">Posterior</div>
            <div className="text-[12px] muted">sigmoid({fusion.log_odds.toFixed(2)}) → risk {fusion.risk.toFixed(1)} / 10</div>
            <div className="text-right num text-[15px] font-semibold" style={{ color: STATUS[statusFor(fusion.risk)].css }}>{(fusion.posterior * 100).toFixed(0)}%</div>
          </div>
        </div>
      );
    }

    function Sparkline({ data, height = 36 }) {
      if (!data || data.length < 2) return null;
      const W = 160, H = height;
      const lo = Math.min(...data), hi = Math.max(...data), r = hi - lo || 1;
      const d = data.map((v, i) => `${i ? 'L' : 'M'}${((i / (data.length - 1)) * W).toFixed(1)},${(H - 3 - ((v - lo) / r) * (H - 6)).toFixed(1)}`).join('');
      const last = data[data.length - 1];
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height }} preserveAspectRatio="none" aria-hidden="true">
          <path d={`${d}L${W},${H}L0,${H}Z`} fill="var(--accent)" fillOpacity="0.08" />
          <path d={d} fill="none" stroke="var(--accent)" strokeWidth="1.6" vectorEffect="non-scaling-stroke" />
          <circle cx={W - 1.5} cy={H - 3 - ((last - lo) / r) * (H - 6)} r="2.5" fill="var(--accent)" />
        </svg>
      );
    }

    // =====================================================================
    // AI PIPELINE STRIP (sense → understand → reason → act)
    // =====================================================================
    function Pipeline({ intel, health, chokes, clusters, routes }) {
      const live = intel?.mode === 'LIVE';
      const gem = (intel?.events || []).filter((e) => e.analysis_engine?.startsWith('GEMINI')).length;
      const rule = (intel?.events || []).filter((e) => e.analysis_engine === 'RULE_ENGINE').length;
      const shift = (chokes || []).filter((c) => c.traffic?.change_point);
      const steps = [
        { k: 'Sense', title: 'Read the world', href: '#/intel', lines: live
          ? [`${fmtNum(intel.articles_ingested)} articles from ${intel.sources_responded}/${intel.sources_total} feeds`, `${(intel.traffic_sources || []).filter((s) => s.ok).length} AIS traffic series · ${(intel.market_sources || []).filter((s) => s.ok).length} price series`]
          : ['Curated briefing loaded', 'Run the AI analysis to read live feeds, AIS and prices'] },
        { k: 'Understand', title: 'Group and rate news', href: '#/intel', lines: live
          ? [`${intel.stories_found} stories via TF-IDF clustering`, `${gem} rated by Gemini · ${rule} by the rule engine`]
          : [`${intel?.events?.length || 0} baseline events`, 'LLM + 16-rule expert system on standby'] },
        { k: 'Reason', title: 'Fuse evidence', href: '#/chokepoints', lines: [
          `Bayesian fusion over ${chokes?.length || 5} chokepoints`,
          shift.length ? `Change point: ${shift.map((c) => `${SHORT[c.id]} since ${shortDate(c.traffic.change_point.date)}`).join(', ')}` : 'Change-point and anomaly checks on AIS traffic'] },
        { k: 'Act', title: 'Plan and advise', href: '#/routes', lines: [
          routes?.safe_route ? `A* expanded ${routes.safe_route.search.nodes_expanded} nodes for ${SHORT[routes.start] || titleCase(routes.start)} → ${SHORT[routes.end] || titleCase(routes.end)}` : 'A* risk-aware routing',
          clusters ? `K-means: ${clusters.clusters.length} groups of goods (silhouette ${clusters.silhouette})` : 'K-means goods-at-risk grouping'] },
      ];
      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
          {steps.map((s, i) => (
            <a key={s.k} href={s.href} className="panel-2 p-4 hover:border-[var(--line-2)] transition-colors relative group">
              <div className="flex items-center gap-2 mb-2">
                <span className="num text-[11px] w-5 h-5 rounded-full flex items-center justify-center" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>{i + 1}</span>
                <span className="kicker !text-[var(--accent)]">{s.k}</span>
                <Icon name="arrow" size={14} className="ml-auto muted opacity-0 group-hover:opacity-100 transition-opacity" />
              </div>
              <div className="text-[14px] font-medium ink">{s.title}</div>
              {s.lines.map((l, j) => <div key={j} className="text-[12.5px] ink-2 mt-1 leading-snug">{l}</div>)}
            </a>
          ))}
        </div>
      );
    }

    // =====================================================================
    // PAGE: COMMAND CENTER
    // =====================================================================
    function ChokeRow({ c, onOpen }) {
      const t = c.traffic;
      return (
        <button onClick={() => onOpen(c.id)} className="w-full text-left px-5 py-3.5 hover:bg-[var(--panel-2)] transition-colors">
          <div className="flex items-center gap-3">
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: STATUS[c.status].css }} />
            <span className="text-[14px] font-medium ink truncate">{c.name}</span>
            <span className="ml-auto num text-[15px] font-semibold ink">{c.effective_risk.toFixed(0)}<span className="text-[11px] muted font-normal">/10</span></span>
          </div>
          <div className="mt-2 track"><span style={{ width: `${c.effective_risk * 10}%`, background: STATUS[c.status].css }} /></div>
          <div className="mt-2 flex items-center gap-x-4 gap-y-1 flex-wrap text-[12px] muted">
            <span className="ink-2">{STATUS[c.status].label}</span>
            {c.fusion && <span>P(disruption) <span className="num ink-2">{(c.fusion.posterior * 100).toFixed(0)}%</span></span>}
            {t && <span>Transits <span className="num" style={{ color: t.pct_vs_baseline <= -0.25 ? 'var(--crit)' : 'var(--ink-2)' }}>{pct(t.pct_vs_baseline)}</span></span>}
          </div>
        </button>
      );
    }

    function CommandCenter({ chokes, signals, intel, ticker, health, clusters, routes, graph, online, theme, openChoke, onIngest, ingesting }) {
      const ordered = useMemo(() => [...(chokes || [])].sort((a, b) => b.effective_risk - a.effective_risk), [chokes]);
      const flow = (chokes || []).reduce((acc, c) => acc + (c.profile?.oil_mbd || 0), 0);
      const atRisk = (chokes || []).reduce((acc, c) => acc + (c.profile?.oil_mbd || 0) * (c.fusion?.posterior || 0), 0);
      const counts = { CRITICAL: 0, ELEVATED: 0, NORMAL: 0 };
      (chokes || []).forEach((c) => { counts[c.status] += 1; });
      const q = Object.fromEntries((ticker?.quotes || []).map((x) => [x.symbol, x]));
      const brent = q['BZ=F'];
      const top = [...(intel?.events || [])].sort((a, b) => b.threat_severity - a.threat_severity || (b.corroboration || 1) - (a.corroboration || 1)).slice(0, 5);
      const live = intel?.mode === 'LIVE';
      const worst = ordered[0];

      return (
        <div className="space-y-6 fade-in">
          {worst && (
            <div className="panel px-5 py-4 flex flex-col md:flex-row md:items-center gap-3 md:gap-5" style={{ borderColor: `color-mix(in srgb, ${STATUS[worst.status].css} 40%, transparent)` }}>
              <StatusPill status={worst.status}>{worst.status === 'CRITICAL' ? 'Critical alert' : STATUS[worst.status].label}</StatusPill>
              <div className="flex-1 min-w-0">
                <div className="text-[14.5px] ink font-medium">{worst.name}: {worst.events[0]?.headline || 'highest risk passage right now'}</div>
                <div className="text-[12.5px] muted mt-0.5">{worst.events[0]?.tactical_directive}</div>
              </div>
              <button className="btn btn-sm shrink-0" onClick={() => openChoke(worst.id)}>See the evidence <Icon name="arrow" size={14} /></button>
            </div>
          )}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <div className="panel p-5 col-span-2 lg:col-span-1">
              <div className="flex items-center gap-2 text-[12px] muted mb-2"><Icon name="oil" size={15} />Oil flow at risk</div>
              <div className="flex items-baseline gap-2"><span className="text-[34px] font-semibold leading-none ink">{chokes ? atRisk.toFixed(1) : '--'}</span><span className="text-[13px] muted">million bbl/day</span></div>
              <div className="text-[12px] ink-2 mt-2">Σ P(disruption) × normal flow, of {flow.toFixed(0)} mb/d through the five passages</div>
            </div>
            <div className="panel p-5">
              <div className="text-[12px] muted mb-2">Passages by status</div>
              <div className="flex items-end gap-5">
                {['CRITICAL', 'ELEVATED', 'NORMAL'].map((k) => (
                  <div key={k}><div className="text-[28px] font-semibold leading-none" style={{ color: STATUS[k].css }}>{counts[k]}</div><div className="text-[11.5px] ink-2 mt-1.5">{STATUS[k].label}</div></div>
                ))}
              </div>
            </div>
            <div className="panel p-5">
              <div className="text-[12px] muted mb-2">Brent crude</div>
              <div className="flex items-baseline gap-2"><span className="text-[28px] font-semibold leading-none ink">{fmtQuote(brent)}</span><span className="num text-[12.5px]" style={{ color: changeColor(brent?.change_pct) }}>{fmtChange(brent?.change_pct)}</span></div>
              <div className="text-[12px] ink-2 mt-2">Seaborne oil benchmark, most exposed to Hormuz</div>
            </div>
            <div className="panel p-5">
              <div className="text-[12px] muted mb-2">AI analysis</div>
              <div className="text-[18px] font-semibold ink leading-tight">{live ? `Live · ${relTime(intel.scanned_at)}` : 'Baseline briefing'}</div>
              <div className="text-[12px] ink-2 mt-2">{live ? `${intel.engine === 'GEMINI' ? intel.model : 'Rule engine'} · ${intel.stories_found} stories` : 'Curated from public reporting, 21 Oct 2026'}</div>
              {!live && <button className="btn btn-sm mt-3" onClick={onIngest} disabled={ingesting || online === false}>{ingesting ? <span className="spinner" /> : null}Analyse live data</button>}
            </div>
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_360px] gap-6">
            <Panel title="Global chokepoint map" sub="Pulsing rings mark elevated and critical passages. Click one for the full analysis." bodyClass="p-3">
              <MaritimeMap graph={graph} chokes={chokes} signals={signals} online={online} theme={theme} onSelect={openChoke} height={520} defaultShips={false} />
            </Panel>
            <Panel title="Risk ranking" sub="Routing risk 0–10, with the Bayesian disruption probability" bodyClass="divide">
              {!chokes && <div className="p-5 muted text-[13px]">Loading…</div>}
              {ordered.map((c) => <ChokeRow key={c.id} c={c} onOpen={openChoke} />)}
            </Panel>
          </div>

          <div>
            <div className="flex items-baseline justify-between mb-3">
              <div className="kicker">AI reasoning pipeline</div>
              <a href="#/ai" className="src">How each step works</a>
            </div>
            <Pipeline intel={intel} health={health} chokes={chokes} clusters={clusters} routes={routes} />
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_400px] gap-6">
            <Panel title="Top threats" sub={live ? 'Highest-rated stories from the latest analysis' : 'Baseline briefing; run the AI analysis for live stories'} actions={<a href="#/intel" className="btn btn-sm btn-ghost">All news <Icon name="arrow" size={14} /></a>} bodyClass="divide">
              {top.map((e) => <ThreatRow key={e.id} e={e} openChoke={openChoke} />)}
            </Panel>
            <Panel title="Market pulse" sub="Live prices tied to chokepoint risk" actions={<a href="#/markets" className="btn btn-sm btn-ghost">Markets <Icon name="arrow" size={14} /></a>} bodyClass="divide">
              {['BWET', 'BDRY', 'MAERSK-B.CO', 'FRO', 'GC=F', 'INR=X'].map((s) => q[s]).filter(Boolean).map((x) => (
                <div key={x.symbol} className="px-5 py-3 flex items-center gap-3">
                  <div className="min-w-0 flex-1">
                    <div className="text-[13.5px] ink">{x.label}</div>
                    <div className="text-[11.5px] muted truncate">{x.note}</div>
                  </div>
                  <div className="text-right">
                    <div className="num text-[13.5px] ink">{fmtQuote(x)}</div>
                    <div className="num text-[11.5px]" style={{ color: changeColor(x.change_pct) }}>{fmtChange(x.change_pct)}</div>
                  </div>
                </div>
              ))}
              {!ticker && <div className="p-5 muted text-[13px]">Loading quotes…</div>}
            </Panel>
          </div>
        </div>
      );
    }

    function SeverityBadge({ s }) {
      const st = statusFor(s);
      return <span className={`pill ${STATUS[st].pill} num`}>{s}/10</span>;
    }

    function ThreatRow({ e, openChoke }) {
      return (
        <div className="px-5 py-3.5 flex gap-4">
          <div className="pt-0.5"><SeverityBadge s={e.threat_severity} /></div>
          <div className="min-w-0 flex-1">
            <div className="text-[14px] ink leading-snug">{e.headline}</div>
            <div className="mt-1.5 flex items-center gap-x-3 gap-y-1 flex-wrap text-[12px] muted">
              {e.choke_point_targeted !== 'NONE'
                ? <button className="ink-2 hover:text-[var(--accent)]" onClick={() => openChoke(e.choke_point_targeted)}>{SHORT[e.choke_point_targeted]}</button>
                : <span>General</span>}
              <span>{EVENT_LABEL[e.event_type] || titleCase(e.event_type)}</span>
              {e.corroboration > 1 && <span>{e.corroboration} outlets</span>}
              <span>{e.verified_citation?.publisher}</span>
              <SourceLink url={e.verified_citation?.url} />
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // PAGE: CHOKEPOINTS
    // =====================================================================
    function ChokepointPage({ id, chokes, signals, clusters, graph, online, theme, setChoke, ais }) {
      const list = useMemo(() => CHOKE_ORDER.map((k) => (chokes || []).find((c) => c.id === k)).filter(Boolean), [chokes]);
      const c = list.find((x) => x.id === id) || list[0];
      if (!c) return <Empty>Loading chokepoints…</Empty>;
      const sig = signals?.chokepoints.find((x) => x.id === c.id);
      const fusion = sig?.fusion;
      const t = sig?.traffic;
      const p = c.profile || {};
      const goods = (clusters?.commodities || []).filter((g) => (g.exposure || {})[c.id]).sort((a, b) => b.exposure[c.id] - a.exposure[c.id]);
      return (
        <div className="space-y-6 fade-in">
          <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
            {list.map((x) => (
              <button key={x.id} onClick={() => setChoke(x.id)} className={`chipbtn !py-2 !px-3.5 ${x.id === c.id ? 'on' : ''}`}>
                <span className="w-2 h-2 rounded-full" style={{ background: STATUS[x.status].css }} />{x.name}<span className="num muted">{x.effective_risk.toFixed(0)}</span>
              </button>
            ))}
          </div>

          <div className="panel p-6">
            <div className="flex flex-col lg:flex-row lg:items-start gap-6">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-3 flex-wrap">
                  <h2 className="text-[24px] font-semibold ink">{c.name}</h2>
                  <StatusPill status={c.status} />
                  {t?.change_point && <span className="pill pill-crit">Disrupted since {fmtDate(t.change_point.date)}</span>}
                </div>
                <p className="text-[14px] ink-2 mt-2 leading-relaxed max-w-3xl">{c.strategic_relevance}</p>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-8 gap-y-4 shrink-0">
                <Stat label="Routing risk" value={c.effective_risk.toFixed(1)} unit="/ 10" tone={STATUS[c.status].css} />
                <Stat label="P(disruption)" value={c.fusion ? `${(c.fusion.posterior * 100).toFixed(0)}%` : '--'} sub={c.fusion ? `${c.fusion.confidence} confidence` : null} />
                <Stat label="Transits / day" value={t ? t.recent_7d_mean.toFixed(0) : '--'} sub={t ? <>normal {t.baseline_median.toFixed(0)} · <span style={{ color: t.pct_vs_baseline <= -0.25 ? 'var(--crit)' : 'inherit' }}>{pct(t.pct_vs_baseline)}</span></> : 'needs live data'} />
                <Stat label="Route penalty" value={c.routing_penalty_days.toFixed(1)} unit="days" sub="added to A* cost" />
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_380px] gap-6">
            <div className="space-y-6 min-w-0">
              <Panel title="How the AI reached this rating" sub="Naive-Bayes fusion: each independent piece of evidence adds its log-likelihood ratio to the prior. Red pushes the probability up, green pulls it down.">
                {fusion ? <EvidenceWaterfall fusion={fusion} /> : <Empty>Loading evidence…</Empty>}
              </Panel>
              <Panel title="Ship transits through the passage" sub={t ? `IMF PortWatch daily AIS counts to ${fmtDate(t.as_of)} (${t.data_lag_days} days lag). Line: 7-day mean; band: Holt 14-day forecast, 80% interval.` : 'Daily AIS transit counts from IMF PortWatch'}>
                {t ? (
                  <>
                    <TrafficChart t={t} />
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 pt-4 border-t hair">
                      <Stat label="Tankers vs normal" value={pct(t.tanker_pct_vs_baseline)} />
                      <Stat label="Containers vs normal" value={pct(t.container_pct_vs_baseline)} />
                      <Stat label="Anomaly score" value={`${t.robust_z >= 0 ? '+' : ''}${t.robust_z.toFixed(1)}`} unit="z" sub={t.anomaly ? 'unusual (|z| ≥ 3)' : 'within normal range'} />
                      <Stat label="Trend" value={titleCase(t.direction)} sub={`Holt α ${t.forecast_model.alpha}, β ${t.forecast_model.beta}`} />
                    </div>
                  </>
                ) : <Empty>Run the AI analysis to load ship-traffic history for this passage.</Empty>}
              </Panel>
            </div>
            <div className="space-y-6">
              <Panel title="Passage profile" sub="Reference figures (EIA 2023 oil flows; canal authorities)" bodyClass="divide">
                {[
                  ['Oil flow (normal)', p.oil_mbd != null ? `${p.oil_mbd} mb/d` : '--'],
                  ['Share of trade', p.share || '--'],
                  ['Normal transits', p.normal_transits_day ? `~${p.normal_transits_day} ships/day` : '--'],
                  ['Narrowest width', p.width_km != null ? (p.width_km < 1 ? `${Math.round(p.width_km * 1000)} m` : `${p.width_km} km`) : '--'],
                  ['Main cargo', p.carries || '--'],
                  ['Structural hazard', `${c.base_hazard} / 10`],
                  ['Coordinates', `${c.lat.toFixed(2)}°, ${c.lng.toFixed(2)}°`],
                ].map(([k, v]) => (
                  <div key={k} className="px-5 py-2.5 flex items-start justify-between gap-4 text-[13px]"><span className="muted">{k}</span><span className="ink text-right">{v}</span></div>
                ))}
              </Panel>
              <Panel title="Goods exposed" sub="Share of each good's sea trade using this passage; supply-hit chance from the noisy-OR model" bodyClass="divide">
                {goods.length === 0 && <div className="px-5 py-4 text-[13px] muted">No tracked goods depend heavily on this passage.</div>}
                {goods.map((g) => (
                  <div key={g.code} className="px-5 py-2.5">
                    <div className="flex items-center justify-between text-[13px]"><span className="ink">{g.name}</span><span className="num ink-2">{(g.exposure[c.id] * 100).toFixed(0)}%</span></div>
                    <div className="track mt-1.5 !h-[5px]"><span style={{ width: `${g.exposure[c.id] * 100}%`, background: 'var(--accent)' }} /></div>
                    <div className="text-[11.5px] muted mt-1">Supply hit {g.supply_hit_probability != null ? `${(g.supply_hit_probability * 100).toFixed(0)}%` : '--'} · {CLUSTER[g.cluster]?.label}</div>
                  </div>
                ))}
              </Panel>
              <Panel title="Latest reports" sub={`${c.events.length} stor${c.events.length === 1 ? 'y' : 'ies'} for this passage`} bodyClass="divide">
                {c.events.length === 0 && <div className="px-5 py-4 text-[13px] muted">Nothing reported right now.</div>}
                {c.events.slice(0, 5).map((e) => (
                  <div key={e.id} className="px-5 py-3.5">
                    <div className="flex items-start gap-3"><SeverityBadge s={e.threat_severity} /><div className="text-[13.5px] ink leading-snug">{e.headline}</div></div>
                    <div className="text-[12.5px] ink-2 mt-2 leading-relaxed">{e.tactical_directive}</div>
                    <div className="flex items-center justify-between mt-2 text-[12px] muted"><span>{e.verified_citation?.publisher}{e.corroboration > 1 ? ` + ${e.corroboration - 1} more` : ''}</span><SourceLink url={e.verified_citation?.url} /></div>
                  </div>
                ))}
              </Panel>
            </div>
          </div>
        </div>
      );
    }

    // =====================================================================
    // PAGE: ROUTE PLANNER (A*)
    // =====================================================================
    const PRESETS = [['SHANGHAI', 'ROTTERDAM'], ['DUBAI', 'NEW_YORK'], ['MUMBAI', 'LONDON'], ['TOKYO', 'NEW_YORK'], ['LOS_ANGELES', 'ROTTERDAM']];
    const SCENARIOS = [
      { id: '', label: 'Current situation' },
      { id: 'HORMUZ:0', label: 'Hormuz reopens' },
      { id: 'SUEZ:10,BAB_EL_MANDEB:10', label: 'Red Sea and Suez closed' },
      { id: 'PANAMA:9', label: 'Panama drought worsens' },
      { id: 'MALACCA:9', label: 'Malacca piracy surge' },
      { id: 'SUEZ:0,BAB_EL_MANDEB:0,HORMUZ:0,PANAMA:0,MALACCA:0', label: 'Everything calm' },
    ];
    const COST_PARTS = [['sail', 'Sailing', 'var(--s1)'], ['dwell', 'Canal waiting', 'var(--s3)'], ['risk', 'Risk penalty', 'var(--s2)']];

    function CostBar({ route, max }) {
      const sail = route.legs.reduce((a, l) => a + l.transit_days, 0);
      const dwell = route.legs.reduce((a, l) => a + l.dwell_days, 0);
      const risk = route.legs.reduce((a, l) => a + l.risk_penalty_days, 0);
      const parts = { sail, dwell, risk };
      return (
        <div>
          <div className="flex h-[14px] gap-[2px]" style={{ width: `${Math.max(8, ((sail + dwell + risk) / max) * 100)}%` }}>
            {COST_PARTS.map(([k, label, col]) => parts[k] > 0.05 && (
              <span key={k} title={`${label}: ${parts[k].toFixed(1)} days`} className="h-full first:rounded-l-[4px] last:rounded-r-[4px]" style={{ flex: parts[k], background: col }} />
            ))}
          </div>
          <div className="flex gap-4 mt-1.5 text-[11.5px] muted flex-wrap">
            {COST_PARTS.map(([k, label]) => <span key={k}>{label} <span className="num ink-2">{parts[k].toFixed(1)} d</span></span>)}
          </div>
        </div>
      );
    }

    function RouteCard({ graph, kind, route, comparison, maxCost }) {
      const safe = kind === 'safe';
      const hazards = route.threat_exposure.map((t) => t.node);
      const tone = route.safety_index >= 70 ? 'var(--ok)' : route.safety_index >= 45 ? 'var(--elev)' : 'var(--crit)';
      return (
        <div className="panel p-5 space-y-4">
          <div className="flex items-center gap-3">
            {safe ? <span className="inline-block w-6 h-[3px] rounded" style={{ background: '#4CC3EE' }} /> : <span className="inline-block w-6 border-t-2 border-dashed" style={{ borderColor: '#F2A93B' }} />}
            <div className="text-[15px] font-semibold ink">{safe ? 'Safest route' : 'Fastest route'}</div>
            <span className="text-[12px] muted">{safe ? 'risk-weighted A* (λ = 1)' : 'time-only A* (λ = 0)'}</span>
            {safe && !comparison.converged && <span className="pill pill-accent ml-auto">Recommended</span>}
          </div>
          <div className="grid grid-cols-3 gap-4">
            <Stat label="Travel time" value={route.eta_days} unit="days" />
            <Stat label="Distance" value={fmtNum(route.nautical_miles)} unit="nm" />
            <Stat label="Safety score" value={route.safety_index} unit="/ 100" tone={tone} />
          </div>
          <div>
            <div className="text-[12px] muted mb-1.5">Path</div>
            <div className="flex flex-wrap items-center gap-x-1.5 gap-y-1 text-[13px]">
              {route.path.map((n, i) => (
                <React.Fragment key={i}>
                  <span style={{ color: hazards.includes(n) ? 'var(--crit)' : 'var(--ink)' }}>{nodeName(graph, n)}</span>
                  {i < route.path.length - 1 && <span className="muted">→</span>}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div>
            <div className="text-[12px] muted mb-1.5">A* objective cost <span className="num ink-2">{route.search.objective_cost_days} days</span></div>
            <CostBar route={route} max={maxCost} />
          </div>
          <div className="flex flex-wrap gap-1.5">
            {route.threat_exposure.length === 0
              ? <span className="text-[12.5px] muted">Crosses no rated hotspot.</span>
              : route.threat_exposure.map((h) => <span key={h.node} className={`pill ${STATUS[statusFor(h.severity)].pill}`}>{nodeName(graph, h.node)} <span className="num">{h.severity}</span></span>)}
          </div>
        </div>
      );
    }

    function SearchTrace({ graph, routes }) {
      return (
        <Panel title="Inside the A* search" sub="Nodes in the order A* took them off the open set (lowest f = g + h first). The heuristic is the great-circle sailing time, which never overestimates.">
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {[['Safest', routes.safe_route], ['Fastest', routes.commercial_route]].map(([label, r]) => (
              <div key={label}>
                <div className="flex items-baseline justify-between mb-2.5">
                  <div className="text-[13.5px] font-medium ink">{label}</div>
                  <div className="text-[12px] muted">expanded <span className="num ink-2">{r.search.nodes_expanded}</span> · generated <span className="num ink-2">{r.search.nodes_generated}</span> · max open <span className="num ink-2">{r.search.max_open_set}</span></div>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {r.search.expansion_order.map((n, i) => {
                    const onPath = r.path.includes(n);
                    return (
                      <span key={i} className={`pill ${onPath ? 'pill-accent' : 'pill-neutral'}`}>
                        <span className="num text-[10.5px] opacity-70">{i + 1}</span>{nodeName(graph, n)}
                      </span>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          <details className="mt-5 pt-4 border-t hair">
            <summary className="text-[13px] ink-2 hover:text-[var(--ink)]">Cost model and formulas</summary>
            <div className="mt-3 space-y-1.5 text-[12.5px]">
              {Object.entries(routes.cost_model).map(([k, v]) => (
                <div key={k} className="grid grid-cols-[130px_1fr] gap-3"><span className="muted">{titleCase(k)}</span><span className="mono ink-2 break-words">{String(v)}</span></div>
              ))}
            </div>
          </details>
        </Panel>
      );
    }

    function RoutePlanner({ graph, chokes, routes, onCompute, online, theme, signals }) {
      const [start, setStart] = useState(routes?.start || 'SHANGHAI');
      const [end, setEnd] = useState(routes?.end || 'ROTTERDAM');
      const [scenario, setScenario] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const nodes = useMemo(() => (graph ? [...graph.nodes].sort((a, b) => a.name.localeCompare(b.name)) : []), [graph]);
      const ports = nodes.filter((n) => n.kind === 'PORT');

      const run = useCallback(async (s = start, e = end, sc = scenario) => {
        if (s === e) { setError('Choose two different ports.'); return; }
        setLoading(true); setError(null);
        try { await onCompute(s, e, sc); }
        catch (err) { setError(String(err.message || err)); }
        setLoading(false);
      }, [start, end, scenario, onCompute]);

      const cmp = routes?.comparison;
      const maxCost = routes?.safe_route ? Math.max(...[routes.safe_route, routes.commercial_route].map((r) => r.legs.reduce((a, l) => a + l.transit_days + l.dwell_days + l.risk_penalty_days, 0))) : 1;
      const override = routes?.override || {};
      const scenChokes = chokes && Object.keys(override).length ? chokes.map((c) => (override[c.id] != null ? { ...c, effective_risk: Math.max(c.base_hazard, override[c.id]), status: statusFor(Math.max(c.base_hazard, override[c.id])) } : c)) : chokes;

      return (
        <div className="space-y-6 fade-in">
          <div className="panel p-5 space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr_auto] gap-3 items-end">
              <div><label className="label">From</label><select className="field" value={start} onChange={(e) => setStart(e.target.value)}>{ports.map((n) => <option key={n.id} value={n.id}>{n.name}</option>)}</select></div>
              <button className="btn btn-ghost !px-2 hidden md:inline-flex mb-0.5" onClick={() => { setStart(end); setEnd(start); }} aria-label="Swap ports" title="Swap">⇄</button>
              <div><label className="label">To</label><select className="field" value={end} onChange={(e) => setEnd(e.target.value)}>{ports.map((n) => <option key={n.id} value={n.id}>{n.name}</option>)}</select></div>
              <button className="btn btn-primary" disabled={loading || !graph || online === false} onClick={() => run()}>
                {loading && <span className="spinner" />}{loading ? 'Searching…' : 'Find routes'}
              </button>
            </div>
            <div className="flex flex-col lg:flex-row lg:items-center gap-3">
              <span className="text-[12px] muted shrink-0 w-[72px]">What if</span>
              <div className="flex gap-1.5 flex-wrap">
                {SCENARIOS.map((s) => <button key={s.id} className={`chipbtn ${scenario === s.id ? 'on' : ''}`} onClick={() => { setScenario(s.id); run(start, end, s.id); }} disabled={loading}>{s.label}</button>)}
              </div>
            </div>
            <div className="flex flex-col lg:flex-row lg:items-center gap-3">
              <span className="text-[12px] muted shrink-0 w-[72px]">Popular</span>
              <div className="flex gap-1.5 flex-wrap">
                {PRESETS.map(([s, e]) => (
                  <button key={s + e} className="chipbtn" disabled={loading || !graph} onClick={() => { setStart(s); setEnd(e); run(s, e, scenario); }}>{nodeName(graph, s)} → {nodeName(graph, e)}</button>
                ))}
              </div>
            </div>
            {error && <div className="text-[13px]" style={{ color: 'var(--crit)' }}>{error}</div>}
          </div>

          {routes?.safe_route && (
            <div className={`panel px-5 py-4 flex flex-col md:flex-row md:items-center gap-4`} style={!cmp.converged ? { borderColor: 'color-mix(in srgb, var(--accent) 40%, transparent)' } : null}>
              <p className="text-[14px] ink flex-1">{cmp.verdict}</p>
              <div className="flex gap-6 text-[13px] muted shrink-0">
                <span>Time <span className="num ink">{cmp.delta_eta_days >= 0 ? '+' : ''}{cmp.delta_eta_days} d</span></span>
                <span>Distance <span className="num ink">{cmp.delta_nautical_miles >= 0 ? '+' : ''}{fmtNum(cmp.delta_nautical_miles)} nm</span></span>
