                <span>Safety <span className="num" style={{ color: 'var(--ok)' }}>{cmp.delta_safety >= 0 ? '+' : ''}{cmp.delta_safety}</span></span>
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_440px] gap-6">
            <div className="panel p-3 min-w-0"><MaritimeMap graph={graph} chokes={scenChokes} routes={routes} signals={signals} online={online} theme={theme} height={600} defaultShips={false} /></div>
            <div className="space-y-4">
              {routes?.safe_route ? (
                <>
                  <RouteCard graph={graph} kind="safe" route={routes.safe_route} comparison={cmp} maxCost={maxCost} />
                  {!cmp.converged && <RouteCard graph={graph} kind="direct" route={routes.commercial_route} comparison={cmp} maxCost={maxCost} />}
                  {cmp.converged && <div className="panel-2 p-4 text-[13px] ink-2">The fastest route is the same path, so there is nothing to trade off.</div>}
                </>
              ) : <Empty>{loading ? 'Searching…' : 'Pick two ports to compare routes.'}</Empty>}
            </div>
          </div>
          {Object.keys(override).length > 0 && <p className="text-[12.5px] muted">What-if applied: {Object.entries(override).map(([k, v]) => `${nodeName(graph, k)} at risk ${v}/10`).join(', ')}.</p>}
          {routes?.safe_route && <SearchTrace graph={graph} routes={routes} />}
        </div>
      );
    }

    // =====================================================================
    // PAGE: THREAT INTELLIGENCE
    // =====================================================================
    function IntelCard({ e, openChoke }) {
      const baseline = e.source_mode === 'BASELINE';
      const gem = e.analysis_engine?.startsWith('GEMINI');
      return (
        <article className="panel p-5 flex flex-col gap-3.5">
          <div className="flex flex-wrap items-center gap-2">
            <SeverityBadge s={e.threat_severity} />
            {e.choke_point_targeted !== 'NONE'
              ? <button className="chipbtn !py-1" onClick={() => openChoke(e.choke_point_targeted)}>{SHORT[e.choke_point_targeted]}</button>
              : <span className="pill pill-neutral">General</span>}
            <span className="text-[12px] muted">{EVENT_LABEL[e.event_type] || titleCase(e.event_type)}</span>
            <span className={`pill ml-auto ${baseline ? 'pill-neutral' : gem ? 'pill-accent' : 'pill-neutral'}`} title={e.analysis_engine}>{baseline ? 'Baseline' : gem ? 'LLM rated' : 'Rule engine'}</span>
          </div>
          <div>
            <h3 className="text-[15px] font-semibold ink leading-snug">{e.headline}</h3>
            {e.summary && <p className="text-[13px] ink-2 leading-relaxed mt-1.5 clamp3">{e.summary}</p>}
          </div>
          <div className="panel-2 px-4 py-3">
            <div className="kicker mb-1">Recommended action</div>
            <div className="text-[13px] ink leading-relaxed">{e.tactical_directive}</div>
            {e.analyst_note && gem && <div className="text-[12px] muted mt-2 leading-relaxed">{e.analyst_note}</div>}
          </div>
          {e.rule_trace?.length > 0 && (
            <div>
              <div className="text-[11.5px] muted mb-1.5">Expert-system rules fired</div>
              <div className="flex flex-wrap gap-1.5">{e.rule_trace.map((r) => <span key={r} className="pill pill-neutral mono !text-[11px]" title={r}>{r.split(' ')[0]}<span className="font-sans opacity-80">{r.slice(r.indexOf(' ') + 1)}</span></span>)}</div>
            </div>
          )}
          {e.coverage?.length > 1 && (
            <details className="text-[12px]">
              <summary className="ink-2 hover:text-[var(--ink)]">{e.corroboration} outlets: {e.coverage.slice(0, 4).map((c) => c.publisher).join(', ')}{e.coverage.length > 4 ? '…' : ''}</summary>
              <ul className="mt-2 space-y-1.5">
                {e.coverage.slice(1).map((c, i) => (
                  <li key={i} className="flex items-start justify-between gap-3"><span className="ink-2 leading-snug"><span className="ink">{c.publisher}:</span> {c.title}</span><SourceLink url={c.url} /></li>
                ))}
              </ul>
            </details>
          )}
          <div className="flex items-center justify-between gap-3 mt-auto text-[12px] muted">
            <span>{e.verified_citation?.publisher}{e.verified_citation?.published_timestamp ? ` · ${relTime(e.verified_citation.published_timestamp)}` : ''}{e.confidence ? ` · confidence ${(e.confidence * 100).toFixed(0)}%` : ''}</span>
            <SourceLink url={e.verified_citation?.url} />
          </div>
        </article>
      );
    }

    function SourceHealth({ intel }) {
      const groups = [
        ['News feeds', intel.sources.map((s) => ({ name: s.publisher, ok: s.ok, info: s.ok ? `${s.items} items` : s.error }))],
        ['Ship traffic (IMF PortWatch)', (intel.traffic_sources || []).map((s) => ({ name: SHORT[s.node] || titleCase(s.node), ok: s.ok, info: s.ok ? `${s.days} days` : s.error }))],
        ['Markets (Yahoo Finance)', (intel.market_sources || []).map((s) => ({ name: s.symbol, ok: s.ok, info: s.ok ? `${s.points} days` : s.error }))],
      ];
      return (
        <details className="panel">
          <summary className="px-5 py-3.5 flex flex-wrap items-center gap-x-5 gap-y-1 text-[13px]">
            <span className="ink font-medium">Sensor health</span>
            {groups.map(([label, g]) => <span key={label} className="muted">{label.split(' (')[0]} <span className="num ink-2">{g.filter((x) => x.ok).length}/{g.length}</span></span>)}
            {intel.sweep_s != null && <span className="muted ml-auto">fetched in <span className="num">{intel.sweep_s}s</span></span>}
          </summary>
          <div className="border-t hair px-5 py-4 grid grid-cols-1 md:grid-cols-3 gap-6">
            {groups.map(([label, g]) => (
              <div key={label}>
                <div className="kicker mb-2">{label}</div>
                <ul className="space-y-1">
                  {g.map((x, i) => (
                    <li key={i} className="flex items-center gap-2 text-[12px]">
                      <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: x.ok ? 'var(--ok)' : 'var(--crit)' }} />
                      <span className="ink-2 truncate">{x.name}</span><span className="muted ml-auto shrink-0">{x.info}</span>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </details>
      );
    }

    function IntelPage({ intel, openChoke, onIngest, ingesting, online }) {
      const [where, setWhere] = useState('ALL');
      const [minSev, setMinSev] = useState(3);
      const events = intel?.events || [];
      const live = intel?.mode === 'LIVE';
      const shown = events.filter((e) => e.threat_severity >= minSev && (where === 'ALL' || e.choke_point_targeted === where));
      const countFor = (k) => events.filter((e) => e.threat_severity >= minSev && (k === 'ALL' || e.choke_point_targeted === k)).length;
      return (
        <div className="space-y-6 fade-in">
          <div className="panel p-5 grid grid-cols-2 md:grid-cols-5 gap-5">
            <Stat label="Mode" value={live ? 'Live' : 'Baseline'} sub={live ? relTime(intel.scanned_at) : 'curated, 21 Oct 2026'} />
            <Stat label="Articles read" value={live ? fmtNum(intel.articles_ingested) : '--'} sub={live ? `${intel.sources_responded}/${intel.sources_total} feeds` : null} />
            <Stat label="Stories" value={live ? intel.stories_found : events.length} sub="after TF-IDF clustering" />
            <Stat label="Rated by" value={live ? (intel.engine === 'GEMINI' ? 'LLM' : 'Rules') : '--'} sub={live ? (intel.model || 'expert system') : null} />
            <div className="flex items-end"><button className="btn btn-primary w-full" onClick={onIngest} disabled={ingesting || online === false}>{ingesting ? <span className="spinner" /> : <Icon name="refresh" size={16} stroke={2} />}{ingesting ? 'Analysing…' : live ? 'Refresh' : 'Analyse live news'}</button></div>
            {intel?.llm_note && <div className="col-span-full text-[12px] muted">{intel.llm_note}</div>}
          </div>
          {live && <SourceHealth intel={intel} />}

          <div className="flex flex-col lg:flex-row lg:items-center gap-3">
            <div className="flex gap-1.5 flex-wrap">
              {['ALL', ...CHOKE_ORDER, 'NONE'].map((k) => (
                <button key={k} className={`chipbtn ${where === k ? 'on' : ''}`} onClick={() => setWhere(k)}>{k === 'ALL' ? 'All passages' : k === 'NONE' ? 'General' : SHORT[k]}<span className="num muted">{countFor(k)}</span></button>
              ))}
            </div>
            <div className="seg lg:ml-auto">
              {[[1, 'All'], [3, '3+'], [5, '5+'], [8, '8+']].map(([v, l]) => <button key={v} className={minSev === v ? 'on' : ''} onClick={() => setMinSev(v)}>Severity {l}</button>)}
            </div>
          </div>

          {!intel && <Empty>Loading intelligence…</Empty>}
          {intel && shown.length === 0 && <Empty>No stories match these filters.</Empty>}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            {shown.map((e) => <IntelCard key={e.id} e={e} openChoke={openChoke} />)}
          </div>
        </div>
      );
    }

    // =====================================================================
    // PAGE: MARKETS
    // =====================================================================
    const MARKET_GROUPS = [
      ['Energy', ['BRENT', 'TTF', 'HH']],
      ['Freight and shipping', ['TANKER_FRT', 'BULK_FRT', 'CONT_EQ', 'TANK_EQ']],
      ['Grains and metals', ['WHEAT', 'SOY', 'CORN', 'CU', 'AL', 'FE']],
    ];
    const TRADE_FINANCE_PANELS = [
      ['Shipping and freight', 'Freight rates and shipping-line shares move first when a passage is disrupted.', ['BDRY', 'BWET', 'MAERSK-B.CO', 'HLAG.DE', '1919.HK', 'ZIM', 'FRO']],
      ['Energy and safe havens', 'Oil reacts to Hormuz and Red Sea risk; gold and silver rise with geopolitical risk.', ['BZ=F', 'CL=F', 'NG=F', 'GC=F', 'SI=F', 'HG=F']],
      ['Currencies and rates', 'Trade is priced in dollars, so the dollar and rates set the cost of cargo and ship finance.', ['DX-Y.NYB', 'INR=X', 'CNY=X', 'EURUSD=X', 'JPY=X', '^TNX']],
      ['Global equity indices', 'Stock markets in the economies that depend most on these sea lanes.', ['^GSPC', '^BSESN', '^NSEI', '^N225', '^HSI', '000001.SS', '^GDAXI', '^FTSE']],
    ];

    function MarketsPage({ markets, ticker, onIngest, ingesting, online }) {
      const by = Object.fromEntries((markets?.series || []).map((s) => [s.code, s]));
      const loaded = markets?.series?.some((s) => s.stats);
      const q = Object.fromEntries((ticker?.quotes || []).map((x) => [x.symbol, x]));
      return (
        <div className="space-y-8 fade-in">
          <div>
            <div className="flex items-baseline justify-between mb-3">
              <div className="kicker">Live quotes</div>
              {ticker?.fetched_at && <div className="text-[12px] muted">Yahoo Finance · updated {clockTime(ticker.fetched_at)}</div>}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-4 gap-5">
              {TRADE_FINANCE_PANELS.map(([title, blurb, symbols]) => (
                <Panel key={title} title={title} sub={blurb} bodyClass="divide">
                  {symbols.map((s) => q[s]).filter(Boolean).map((x) => (
                    <div key={x.symbol} className="px-5 py-2.5 flex items-start justify-between gap-3">
                      <div className="min-w-0"><div className="text-[13px] ink">{x.label}</div><div className="text-[11.5px] muted leading-snug">{x.note}</div></div>
                      <div className="text-right shrink-0"><div className="num text-[13px] ink">{fmtQuote(x)}</div><div className="num text-[11.5px]" style={{ color: changeColor(x.change_pct) }}>{fmtChange(x.change_pct) || '--'}</div></div>
                    </div>
                  ))}
                  {!ticker && <div className="px-5 py-4 text-[13px] muted">Loading…</div>}
                </Panel>
              ))}
            </div>
          </div>
          <div>
            <div className="flex items-baseline justify-between mb-3">
              <div className="kicker">90-day history and stress signal</div>
              <div className="text-[12px] muted">Badge: today's price vs its 3-month average, in standard deviations</div>
            </div>
            {!loaded && <Empty action={<button className="btn btn-primary" onClick={onIngest} disabled={ingesting || online === false}>{ingesting && <span className="spinner" />}Run AI analysis</button>}>Price history is loaded with the AI analysis. It feeds the market evidence in the Bayesian fusion and the goods clustering.</Empty>}
            {loaded && MARKET_GROUPS.map(([g, codes]) => (
              <div key={g} className="mb-6">
                <div className="text-[13px] font-medium ink-2 mb-2.5">{g}</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-4">
                  {codes.map((c) => by[c]).filter((s) => s && s.stats).map((s) => {
                    const st = s.stats, z = st.z_score_3m;
                    const tone = Math.abs(z) >= 1.5 ? (z > 0 ? 'pill-crit' : 'pill-ok') : 'pill-neutral';
                    return (
                      <div key={s.code} className="panel p-4 flex flex-col gap-2">
                        <div className="flex items-start justify-between gap-2">
                          <div className="text-[13.5px] ink leading-snug">{s.name}</div>
                          <span className={`pill ${tone} num !py-0.5`}>{z >= 0 ? '+' : ''}{z.toFixed(1)}σ</span>
                        </div>
                        <div className="flex items-baseline gap-2"><span className="num text-[19px] ink">{fmtPrice(st.last)}</span><span className="text-[11px] muted">{s.unit}</span></div>
                        <Sparkline data={st.spark} />
                        <div className="flex justify-between text-[11.5px] muted">
                          <span>1 m <span className="num ink-2">{pct(st.ret_1m, 1)}</span></span>
                          <span>vol <span className="num ink-2">{(st.vol_30d_ann * 100).toFixed(0)}%</span></span>
                          <span className="num">{st.as_of}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =====================================================================
    // PAGE: GOODS AT RISK (K-MEANS + NOISY-OR)
    // =====================================================================
    const CLUSTER = {
      HIGH_SYSTEMIC_RISK: { label: 'High risk', pill: 'pill-crit', css: 'var(--crit)' },
      ELEVATED_WATCH: { label: 'Watch', pill: 'pill-elev', css: 'var(--elev)' },
      STABLE_NORMAL_FLOW: { label: 'Stable', pill: 'pill-ok', css: 'var(--ok)' },
    };

    function Scatter({ data }) {
      const W = 520, H = 360, m = { l: 46, r: 18, t: 16, b: 42 };
      const [ref, toLocal] = useSvgPointer(W);
      const [hover, setHover] = useState(null);
      const sx = (v) => m.l + (v / 100) * (W - m.l - m.r);
      const sy = (v) => H - m.b - (v / 100) * (H - m.t - m.b);
      // label a point only if its label box does not collide with one already placed (hover shows the rest)
      const placed = [];
      const labelled = new Set();
      [...data.commodities].sort((a, b) => (b.supply_hit_probability || 0) - (a.supply_hit_probability || 0)).forEach((c) => {
        const name = c.name.split(' (')[0];
        const w = name.length * 6.2, x = sx(c.volatility), y = sy(c.stress);
        const dots = data.commodities.filter((o) => o.code !== c.code).map((o) => [sx(o.volatility) - 5, sy(o.stress) - 5, sx(o.volatility) + 5, sy(o.stress) + 5]);
        const hits = (box) => [...placed, ...dots].some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1]);
        const options = [[[x + 8, y - 8, x + 10 + w, y + 6], ''], [[x - 10 - w, y - 8, x - 8, y + 6], ':L']]
          .filter(([b]) => b[0] >= m.l && b[2] <= W - m.r);
        const pick = options.find(([b]) => !hits(b));
        if (!pick) return;
        placed.push(pick[0]);
        labelled.add(c.code + pick[1]);
      });
      return (
        <div className="relative">
          <svg ref={ref} viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block" role="img" aria-label="Goods by price swings and supply strain">
            {[0, 25, 50, 75, 100].map((g) => (
              <g key={g}>
                <line x1={sx(g)} x2={sx(g)} y1={m.t} y2={H - m.b} stroke="var(--grid)" />
                <line x1={m.l} x2={W - m.r} y1={sy(g)} y2={sy(g)} stroke="var(--grid)" />
                <text x={sx(g)} y={H - m.b + 17} textAnchor="middle" fontSize="11" fill="var(--muted)" fontFamily="IBM Plex Mono">{g}</text>
                <text x={m.l - 9} y={sy(g) + 4} textAnchor="end" fontSize="11" fill="var(--muted)" fontFamily="IBM Plex Mono">{g}</text>
              </g>
            ))}
            <text x={(W + m.l) / 2} y={H - 6} textAnchor="middle" fontSize="12" fill="var(--ink-2)">Price swings (volatility score)</text>
            <text x={13} y={(H - m.b + m.t) / 2} textAnchor="middle" fontSize="12" fill="var(--ink-2)" transform={`rotate(-90 13 ${(H - m.b + m.t) / 2})`}>Supply strain</text>
            {data.commodities.map((c) => {
              const cl = data.clusters.find((k) => k.label === c.cluster);
              return cl && <line key={'l' + c.code} x1={sx(c.volatility)} y1={sy(c.stress)} x2={sx(cl.centroid[0])} y2={sy(cl.centroid[1])} stroke={CLUSTER[c.cluster].css} strokeOpacity="0.3" />;
            })}
            {data.clusters.map((k) => {
              const x = sx(k.centroid[0]), y = sy(k.centroid[1]), col = CLUSTER[k.label].css;
              return <g key={k.label}><line x1={x - 8} x2={x + 8} y1={y} y2={y} stroke={col} strokeWidth="2" /><line x1={x} x2={x} y1={y - 8} y2={y + 8} stroke={col} strokeWidth="2" /></g>;
            })}
            {data.commodities.map((c) => (
              <g key={c.code} onMouseEnter={(e) => { const p = toLocal(e); setHover({ c, px: (sx(c.volatility) / W) * p.w, py: (sy(c.stress) / H) * p.h }); }} onMouseLeave={() => setHover(null)} style={{ cursor: 'default' }}>
                <circle cx={sx(c.volatility)} cy={sy(c.stress)} r="12" fill="transparent" />
                <circle cx={sx(c.volatility)} cy={sy(c.stress)} r={hover?.c.code === c.code ? 6.5 : 5} fill={CLUSTER[c.cluster].css} stroke="var(--panel)" strokeWidth="2" />
                {labelled.has(c.code) && <text x={sx(c.volatility) + 9} y={sy(c.stress) + 4} fontSize="11" fill="var(--ink-2)">{c.name.split(' (')[0]}</text>}
                {labelled.has(c.code + ':L') && <text x={sx(c.volatility) - 9} y={sy(c.stress) + 4} fontSize="11" fill="var(--ink-2)" textAnchor="end">{c.name.split(' (')[0]}</text>}
              </g>
            ))}
          </svg>
          {hover && (
            <div className="tip" style={{ left: hover.px, top: hover.py }}>
              <div className="font-medium">{hover.c.name}</div>
              <div><span className="t-k">Price swings</span> <span className="num">{hover.c.volatility}</span> · <span className="t-k">strain</span> <span className="num">{hover.c.stress}</span></div>
              <div><span className="t-k">Group</span> {CLUSTER[hover.c.cluster].label} · <span className="t-k">supply hit</span> <span className="num">{hover.c.supply_hit_probability != null ? `${(hover.c.supply_hit_probability * 100).toFixed(0)}%` : '--'}</span></div>
            </div>
          )}
        </div>
      );
    }

    function ExposureHeat({ data, chokes }) {
      const rows = [...data.commodities].sort((a, b) => (b.supply_hit_probability || 0) - (a.supply_hit_probability || 0));
      const risk = Object.fromEntries((chokes || []).map((c) => [c.id, c.fusion?.posterior]));
      return (
        <div className="overflow-x-auto">
          <table className="tbl">
            <thead><tr><th>Good</th>{CHOKE_ORDER.map((k) => <th key={k} className="text-center !px-1">{k === 'BAB_EL_MANDEB' ? 'Bab-el-M.' : SHORT[k]}<div className="num font-normal">{risk[k] != null ? `${(risk[k] * 100).toFixed(0)}%` : ''}</div></th>)}<th className="text-right">Supply hit</th></tr></thead>
            <tbody>
              {rows.map((g) => (
                <tr key={g.code}>
                  <td className="ink whitespace-nowrap">{g.name}</td>
                  {CHOKE_ORDER.map((k) => {
                    const w = (g.exposure || {})[k] || 0;
                    return <td key={k} className="text-center num !py-1.5 !px-1" title={`${Math.round(w * 100)}% of ${g.name} sea trade uses ${SHORT[k]}`}>
                      <span className="inline-flex items-center justify-center w-[44px] h-[24px] rounded-[5px] text-[11px]" style={{ background: w ? `color-mix(in srgb, var(--accent) ${Math.round(12 + w * 70)}%, transparent)` : 'transparent', color: w >= 0.5 ? 'var(--accent-ink)' : w ? 'var(--ink)' : 'var(--muted)' }}>{w ? `${Math.round(w * 100)}%` : '·'}</span>
                    </td>;
                  })}
                  <td className="text-right num ink">{g.supply_hit_probability != null ? `${(g.supply_hit_probability * 100).toFixed(0)}%` : '--'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function GoodsPage({ data, k, setK, chokes }) {
      if (!data) return <Empty>Loading…</Empty>;
      return (
        <div className="space-y-6 fade-in">
          <div className="flex flex-col md:flex-row md:items-center gap-3">
            <div className="flex-1 text-[13px] ink-2">{data.algorithm} on two features. {data.converged ? `Converged in ${data.iterations} iterations` : 'Did not converge'} · silhouette <span className="num ink">{data.silhouette}</span> · WCSS <span className="num ink">{fmtNum(data.inertia_wcss, 0)}</span></div>
            <div className="seg">{[2, 3].map((n) => <button key={n} className={k === n ? 'on' : ''} onClick={() => setK(n)}>k = {n}</button>)}</div>
          </div>
          <div className={`grid grid-cols-1 ${data.clusters.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-4`}>
            {data.clusters.map((cl) => (
              <div key={cl.label} className="panel p-5">
                <div className="flex items-center justify-between"><span className={`pill ${CLUSTER[cl.label].pill}`}><span className="dot" />{CLUSTER[cl.label].label}</span><span className="text-[12px] muted">{cl.size} goods · centroid <span className="num">({cl.centroid.map((v) => v.toFixed(0)).join(', ')})</span></span></div>
                <div className="text-[13.5px] ink mt-3 leading-relaxed">{cl.members.join(', ')}</div>
              </div>
            ))}
          </div>
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
            <Panel title="Clusters" sub="Each dot is a good; crosses are the k-means centroids. Hover a dot for details.">
              <Scatter data={data} />
              <div className="flex gap-4 mt-3 text-[12px] ink-2 flex-wrap">{data.clusters.map((cl) => <span key={cl.label} className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{ background: CLUSTER[cl.label].css }} />{CLUSTER[cl.label].label}</span>)}</div>
              <p className="text-[12px] muted mt-3 leading-relaxed">{data.data_note}</p>
            </Panel>
            <Panel title="Exposure to each passage" sub="Share of each good's sea trade through the passage (column header: its current disruption probability). Supply hit = 1 − Π(1 − share × P), the noisy-OR model." bodyClass="p-2">
              <ExposureHeat data={data} chokes={chokes} />
            </Panel>
          </div>
        </div>
      );
    }

    // =====================================================================
    // PAGE: HOW THE AI WORKS
    // =====================================================================
    function AIPage({ health, intel, chokes, signals, clusters, routes }) {
      const agent = health?.agent;
      const events = intel?.events || [];
      const gem = events.filter((e) => e.analysis_engine?.startsWith('GEMINI')).length;
      const rule = events.filter((e) => e.analysis_engine === 'RULE_ENGINE').length;
      const sig = signals?.chokepoints || [];
      const shifts = sig.filter((c) => c.traffic?.change_point);
      const anomalies = sig.filter((c) => c.traffic?.anomaly).length;
      const hz = sig.find((c) => c.id === 'HORMUZ')?.traffic;
      const topGood = clusters ? [...clusters.commodities].sort((a, b) => (b.supply_hit_probability || 0) - (a.supply_hit_probability || 0))[0] : null;
      const topChoke = chokes ? [...chokes].sort((a, b) => (b.fusion?.posterior || 0) - (a.fusion?.posterior || 0))[0] : null;
      const live = intel?.mode === 'LIVE';
      const T = [
        { n: 'A* search', cat: 'Search', what: 'Finds the safest and the fastest sea route on a 16-node graph. Cost g = sailing days + canal waits + λ × risk penalty; heuristic h = great-circle sailing time.', where: 'Nishant/routing.py · a_star()', live: routes?.safe_route ? `Last search expanded ${routes.safe_route.search.nodes_expanded} nodes; heuristic ${health?.heuristic?.admissible ? 'admissible and consistent' : 'not verified'} over ${health?.heuristic?.directed_edges_checked} edges` : 'Run a route search', href: '#/routes' },
        { n: 'LLM threat analyst', cat: 'Generative AI', what: 'Gemini reads the top stories and returns strict JSON: passage, event type, severity 1–10 and a recommended action. Rate-limited, with automatic fallback.', where: 'Nishant/core.py · LLMEngine', live: live ? `${gem} stories rated by ${intel.model || 'Gemini'}` : `Status: ${health?.llm?.status || '…'}`, href: '#/intel' },
        { n: 'Rule-based expert system', cat: 'Knowledge-based', what: '16 forward-chaining rules (R01–R16) rate news when the LLM is unavailable and give an explainable rule trace.', where: 'Yash/intelligence.py · rule_engine_assess()', live: live ? `${rule} stories rated by rules` : 'On standby', href: '#/intel' },
        { n: 'TF-IDF + cosine similarity', cat: 'NLP', what: 'Turns articles into term vectors, merges reports of the same event across outlets (corroboration), and retrieves context for the Copilot (RAG).', where: 'Abhik/ai_models.py · cluster_stories()', live: live ? `${fmtNum(intel.articles_ingested)} articles → ${intel.stories_found} stories` : 'Runs on live news', href: '#/intel' },
        { n: 'Naive-Bayes evidence fusion', cat: 'Probabilistic reasoning', what: 'Adds log-likelihood ratios from news, AIS traffic, Cape diversions and markets to a structural prior to get P(disruption) per passage.', where: 'Abhik/ai_models.py · fuse()', live: topChoke?.fusion ? `${topChoke.name}: ${(topChoke.fusion.posterior * 100).toFixed(0)}% (${topChoke.fusion.confidence} confidence)` : '…', href: '#/chokepoints' },
        { n: 'Change-point detection', cat: 'Time series', what: 'Least-squares split of the transit series finds a lasting regime shift (such as a closure), so "normal" is measured from before it.', where: 'Abhik/ai_models.py · detect_change_point()', live: shifts.length ? shifts.map((c) => `${SHORT[c.id]} ${shortDate(c.traffic.change_point.date)} (${pct(c.traffic.change_point.shift)})`).join(', ') : live ? 'No lasting shift detected' : 'Runs on live AIS data', href: '#/chokepoints/HORMUZ' },
        { n: 'Robust anomaly detection', cat: 'Time series', what: '7-day mean against a median/MAD baseline gives a z-score that resists outliers; |z| ≥ 3 is flagged unusual.', where: 'Abhik/ai_models.py · analyse_traffic()', live: sig.some((c) => c.traffic) ? `${anomalies} passage${anomalies === 1 ? '' : 's'} flagged unusual` : 'Runs on live AIS data', href: '#/chokepoints' },
        { n: 'Holt exponential smoothing', cat: 'Forecasting', what: 'Level + trend model with α, β fitted by grid search on one-step-ahead error; 14-day forecast with an 80% band.', where: 'Abhik/ai_models.py · holt_fit()', live: hz ? `Hormuz: α ${hz.forecast_model.alpha}, β ${hz.forecast_model.beta}, RMSE ${hz.forecast_model.rmse}` : 'Runs on live AIS data', href: '#/chokepoints/HORMUZ' },
        { n: 'K-means clustering', cat: 'Unsupervised learning', what: 'k-means++ groups goods by price volatility and supply strain into High risk / Watch / Stable; silhouette measures fit.', where: 'Yash/clustering.py · kmeans()', live: clusters ? `k = ${clusters.k}, silhouette ${clusters.silhouette}, ${clusters.iterations} iterations` : '…', href: '#/goods' },
        { n: 'Noisy-OR model', cat: 'Probabilistic reasoning', what: 'Chance that a good\'s supply is hit by any passage: 1 − Π(1 − exposure × P(disruption)).', where: 'Abhik/ai_models.py · noisy_or()', live: topGood ? `${topGood.name}: ${(topGood.supply_hit_probability * 100).toFixed(0)}%` : '…', href: '#/goods' },
        { n: 'Tool-using agent (Copilot)', cat: 'Agents', what: 'Gemini plans tool calls (routes, risk evidence, news search, traffic, markets, goods) and answers only with numbers from the platform.', where: 'Abhik/copilot.py · agent_answer()', live: 'Ask a question from the sidebar', href: null },
      ];
      return (
        <div className="space-y-6 fade-in">
          <Panel title="Agent design (PEAS)" sub={agent ? `${agent.type}. Environment: ${agent.environment}.` : null}>
            {agent ? (
              <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                <div><div className="kicker mb-2">Performance</div><div className="text-[13.5px] ink leading-relaxed">{agent.performance}</div></div>
                <div><div className="kicker mb-2">Environment</div><div className="text-[13.5px] ink leading-relaxed">Global sea-lane graph of 16 nodes and {health.graph.directed_edges} directed edges; partially observable, dynamic, stochastic</div></div>
                <div><div className="kicker mb-2">Actuators</div><ul className="text-[13.5px] ink space-y-1">{agent.actuators.map((a) => <li key={a}>{a}</li>)}</ul></div>
                <div><div className="kicker mb-2">Sensors</div><ul className="text-[13px] ink-2 space-y-1">
                  <li>{agent.sensors.news.length} news feeds</li><li>{agent.sensors.traffic}</li><li>{agent.sensors.markets.length} market series</li><li>Live AIS: {agent.sensors.live_ais.join(', ')}</li>
                </ul></div>
              </div>
            ) : <div className="muted">Loading…</div>}
          </Panel>
          <div>
            <div className="kicker mb-3">Reasoning pipeline</div>
            <Pipeline intel={intel} health={health} chokes={chokes} clusters={clusters} routes={routes} />
          </div>
          <div>
            <div className="kicker mb-3">AI techniques · live results</div>
            <div className="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-4">
              {T.map((t) => {
                const body = (
                  <>
                    <div className="flex items-center justify-between gap-2"><span className="pill pill-accent">{t.cat}</span><span className="mono text-[11px] muted truncate">{t.where}</span></div>
                    <div className="text-[15px] font-semibold ink mt-3">{t.n}</div>
                    <p className="text-[13px] ink-2 mt-1.5 leading-relaxed flex-1">{t.what}</p>
                    <div className="mt-3 pt-3 border-t hair flex items-start gap-2 text-[12.5px]"><span className="w-1.5 h-1.5 rounded-full mt-[6px] shrink-0" style={{ background: 'var(--ok)' }} /><span className="ink">{t.live}</span></div>
                  </>
                );
                return t.href
                  ? <a key={t.n} href={t.href} className="panel p-5 flex flex-col hover:border-[var(--line-2)] transition-colors">{body}</a>
                  : <div key={t.n} className="panel p-5 flex flex-col">{body}</div>;
              })}
            </div>
          </div>
          {signals?.fusion_model && (
            <Panel title="Fusion model specification" sub="Exact formulas used to turn evidence into a disruption probability">
              <div className="space-y-1.5 text-[12.5px]">
                {Object.entries(signals.fusion_model).map(([k, v]) => <div key={k} className="grid grid-cols-[100px_1fr] gap-3"><span className="muted capitalize">{k}</span><span className="mono ink-2 break-words">{v}</span></div>)}
              </div>
            </Panel>
          )}
        </div>
      );
    }

    // =====================================================================
    // COPILOT DRAWER
    // =====================================================================
    const SUGGESTIONS = [
      'Is it safe to send an LNG tanker from Dubai to Rotterdam this week?',
      'How much ship traffic is going through Hormuz?',
      'Why is the Red Sea rated the way it is?',
      'What happens to oil tankers if Hormuz reopens?',
      'What are oil and freight markets doing?',
      'Which goods are most at risk?',
    ];
    const TOOL_LABEL = {
      get_chokepoint_risk: 'Risk evidence', compare_routes: 'Route search', search_news: 'News search',
      get_ship_traffic: 'Ship traffic', get_market_data: 'Market data', get_goods_at_risk: 'Goods at risk',
    };

    function Copilot({ online, open, setOpen }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [busy, setBusy] = useState(false);
      const listRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => { const el = listRef.current; if (el) el.scrollTop = el.scrollHeight; }, [messages, busy, open]);
      useEffect(() => { if (open) setTimeout(() => inputRef.current?.focus(), 50); }, [open]);
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [setOpen]);

      const send = async (text, preset = false) => {
        const cmd = (text ?? input).trim();
        if (!cmd || busy) return;
        setMessages((m) => [...m, { role: 'user', text: cmd }]);
        setInput('');
        setBusy(true);
        try {
          const data = await api('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ command: cmd, preset }) }, 45000);
          setMessages((m) => [...m, { role: 'ai', text: data.response || 'No answer was returned.', engine: data.engine, tools: data.tools_used || [], note: data.note }]);
        } catch {
          setMessages((m) => [...m, { role: 'err', text: "Couldn't reach the server. Make sure the server (python run.py) is running, then try again." }]);
        }
        setBusy(false);
      };

      return (
        <>
          {open && <div className="fixed inset-0 z-[1290] bg-black/30 lg:bg-transparent lg:pointer-events-none" onClick={() => setOpen(false)} />}
          <aside role="dialog" aria-label="AI analyst" aria-hidden={!open}
            className="fixed z-[1300] top-0 right-0 bottom-0 w-full sm:w-[460px] flex flex-col border-l hair transition-transform duration-200"
            style={{ background: 'var(--panel)', boxShadow: open ? 'var(--shadow)' : 'none', transform: open ? 'none' : 'translateX(105%)', visibility: open ? 'visible' : 'hidden', transition: 'transform .2s ease, visibility .2s' }}>
            <div className="px-5 py-4 border-b hair flex items-center justify-between gap-3 shrink-0">
              <div className="flex items-center gap-3">
                <span className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}><Icon name="chat" /></span>
                <div><div className="text-[15px] font-semibold ink">AI analyst</div><div className="text-[12px] muted">Answers from live news, AIS, prices and routing</div></div>
              </div>
              <div className="flex items-center gap-1">
                {messages.length > 0 && <button className="btn btn-sm btn-ghost" onClick={() => setMessages([])} disabled={busy}>Clear</button>}
                <button className="btn btn-sm btn-ghost !px-2" onClick={() => setOpen(false)} aria-label="Close"><Icon name="close" /></button>
              </div>
            </div>
            <div ref={listRef} className="flex-1 overflow-y-auto px-5 py-5 space-y-5">
              {messages.length === 0 && (
                <div className="space-y-3">
                  <p className="text-[13px] muted">Ask about any passage, route, good or market. Try:</p>
                  {SUGGESTIONS.map((s) => (
                    <button key={s} onClick={() => send(s, true)} disabled={busy || online === false} className="panel-2 w-full text-left px-4 py-3 text-[13px] ink-2 hover:text-[var(--ink)] hover:border-[var(--line-2)] transition-colors">{s}</button>
                  ))}
                </div>
              )}
              {messages.map((m, i) => (
                <div key={i}>
                  {m.role === 'user' && <div className="flex justify-end"><div className="max-w-[85%] rounded-2xl rounded-br-md px-4 py-2.5 text-[13.5px] ink" style={{ background: 'var(--accent-soft)' }}>{m.text}</div></div>}
                  {m.role === 'ai' && (
                    <div className="space-y-2">
                      {m.tools?.length > 0 && (
                        <div className="flex flex-wrap gap-1.5">
                          {m.tools.map((t, j) => <span key={j} className="pill pill-neutral !text-[11px] !py-1" title={JSON.stringify(t.args)}>{TOOL_LABEL[t.tool] || t.tool}{t.args?.chokepoint ? `: ${titleCase(t.args.chokepoint)}` : t.args?.query ? `: "${t.args.query}"` : ''}</span>)}
                        </div>
                      )}
                      <div className="md text-[13.5px] ink-2 leading-relaxed" dangerouslySetInnerHTML={{ __html: renderMarkdown(m.text) }} />
                      <div className="text-[11px] muted">{m.engine === 'RULE_ENGINE' ? 'Answered by the built-in analyst' : m.engine}{m.note ? ` · ${m.note}` : ''}</div>
                    </div>
                  )}
                  {m.role === 'err' && <div className="text-[13px]" style={{ color: 'var(--crit)' }}>{m.text}</div>}
                </div>
              ))}
              {busy && <div className="flex items-center gap-2 text-[13px] muted"><span className="spinner" />Thinking with tools…</div>}
            </div>
            <form className="px-4 py-3 border-t hair flex items-center gap-2 shrink-0" onSubmit={(e) => { e.preventDefault(); send(); }}>
              <input ref={inputRef} value={input} onChange={(e) => setInput(e.target.value)} disabled={busy || online === false} className="field" placeholder="Ask a question" />
              <button className="btn btn-primary" type="submit" disabled={busy || !input.trim() || online === false}>Send</button>
            </form>
          </aside>
          {!open && (
            <button onClick={() => setOpen(true)} aria-label="Ask the AI analyst" className="fixed z-[1250] right-5 bottom-5 h-12 pl-4 pr-5 rounded-full flex items-center gap-2 btn-primary font-semibold text-[13.5px]" style={{ boxShadow: 'var(--shadow)' }}>
              <Icon name="chat" size={20} />Ask AI
            </button>
          )}
        </>
      );
    }

    // =====================================================================
    // APP
    // =====================================================================
    function parseHash() {
      const parts = (window.location.hash || '').replace(/^#\/?/, '').split('/');
      const page = NAV.some((n) => n.id === parts[0]) ? parts[0] : 'command';
      return { page, arg: parts[1] || null };
    }

    function App() {
      const [route, setRoute] = useState(parseHash());
      const [theme, setTheme] = useState(readTheme());
      const [menu, setMenu] = useState(false);
      const [online, setOnline] = useState(null);
      const [health, setHealth] = useState(null);
      const [graph, setGraph] = useState(null);
      const [chokes, setChokes] = useState(null);
      const [intel, setIntel] = useState(null);
      const [ingesting, setIngesting] = useState(false);
      const [clusters, setClusters] = useState(null);
      const [k, setK] = useState(2);
      const [routes, setRoutes] = useState(null);
      const [chatOpen, setChatOpen] = useState(false);
      const [signals, setSignals] = useState(null);
      const [markets, setMarkets] = useState(null);
      const [ticker, setTicker] = useState(null);
      const lastRouteReq = useRef(null);
      const kRef = useRef(2);

      useEffect(() => {
        const on = () => { setRoute(parseHash()); window.scrollTo({ top: 0 }); };
        window.addEventListener('hashchange', on);
        return () => window.removeEventListener('hashchange', on);
      }, []);

      const toggleTheme = useCallback(() => {
        const t = theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        try { localStorage.setItem('gc-theme', t); } catch {}
        setTheme(t);
      }, [theme]);

      const ping = useCallback(async () => {
        try { setHealth(await api('/api/health', {}, 6000)); setOnline(true); return true; }
        catch { setOnline(false); return false; }
      }, []);
      const loadChokes = useCallback(async () => { try { setChokes((await api('/api/chokepoints')).chokepoints); } catch {} }, []);
      const loadClusters = useCallback(async (kk) => { try { setClusters(await api(`/api/clusters?k=${kk ?? kRef.current}`)); } catch {} }, []);
      const loadIntel = useCallback(async () => { try { setIntel(await api('/api/intelligence')); } catch {} }, []);
      const loadGraph = useCallback(async () => { try { setGraph(await api('/api/graph')); } catch {} }, []);
      const loadSignals = useCallback(async () => { try { setSignals(await api('/api/signals')); } catch {} }, []);
      const loadMarkets = useCallback(async () => { try { setMarkets(await api('/api/markets')); } catch {} }, []);

      const computeRoute = useCallback(async (start, end, override) => {
        const qs = new URLSearchParams({ start, end, override: override || '' });
        const data = await api(`/api/routes?${qs.toString()}`);
        lastRouteReq.current = { start, end, override };
        setRoutes(data);
        return data;
      }, []);

      const bootstrap = useCallback(async () => {
        if (!(await ping())) return;
        await Promise.all([loadGraph(), loadChokes(), loadIntel(), loadClusters(), loadSignals(), loadMarkets()]);
        if (!lastRouteReq.current) { try { await computeRoute('SHANGHAI', 'ROTTERDAM', ''); } catch {} }
      }, [ping, loadGraph, loadChokes, loadIntel, loadClusters, loadSignals, loadMarkets, computeRoute]);

      useEffect(() => { bootstrap(); }, [bootstrap]);

      useEffect(() => {
        const t = setInterval(async () => {
          const wasDown = online === false || !graph;
          const ok = await ping();
          if (ok && wasDown) bootstrap();
        }, 20000);
        return () => clearInterval(t);
      }, [online, graph, ping, bootstrap]);

      useEffect(() => { kRef.current = k; loadClusters(k); }, [k, loadClusters]);

      useEffect(() => {
        const load = async () => { try { setTicker(await api('/api/ticker', {}, 20000)); } catch {} };
        load();
        const t = setInterval(load, 120000);
        return () => clearInterval(t);
      }, []);

      const ingest = useCallback(async () => {
        setIngesting(true);
        try {
          setIntel(await api('/api/intelligence/ingest', { method: 'POST' }, 150000));
          await Promise.all([loadChokes(), loadClusters(), loadSignals(), loadMarkets(), ping()]);
          if (lastRouteReq.current) {
            const { start, end, override } = lastRouteReq.current;
            try { await computeRoute(start, end, override); } catch {}
          }
        } catch { setOnline(false); }
        setIngesting(false);
      }, [loadChokes, loadClusters, loadSignals, loadMarkets, ping, computeRoute]);

      const openChoke = useCallback((id) => { window.location.hash = `#/chokepoints/${id}`; }, []);
      const nav = NAV.find((n) => n.id === route.page);
      const common = { online, theme, graph, chokes, signals };

      return (
        <div className="shell">
          <Sidebar route={route} open={menu} setOpen={setMenu} health={health} online={online} chokes={chokes} theme={theme} toggleTheme={toggleTheme} onAsk={() => setChatOpen(true)} />
          <div className="min-w-0 flex flex-col">
            <TopBar nav={nav} intel={intel} ingesting={ingesting} onIngest={ingest} online={online} onMenu={() => setMenu(true)} ticker={ticker} />
            <main className="flex-1 px-4 sm:px-5 lg:px-8 py-6 lg:py-8 max-w-[1600px] w-full mx-auto">
              {online === false && (
                <div className="panel px-5 py-4 mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3" style={{ borderColor: 'color-mix(in srgb, var(--crit) 45%, transparent)' }}>
                  <div>
                    <div className="text-[14px] font-medium" style={{ color: 'var(--crit)' }}>Can't reach the server</div>
                    <div className="text-[13px] ink-2 mt-1">Start it with <span className="mono ink">python run.py</span>, then open <span className="mono ink">http://localhost:8000</span>.</div>
                  </div>
                  <button className="btn" onClick={bootstrap}>Retry</button>
                </div>
              )}
              {route.page === 'command' && <CommandCenter {...common} intel={intel} ticker={ticker} health={health} clusters={clusters} routes={routes} openChoke={openChoke} onIngest={ingest} ingesting={ingesting} />}
              {route.page === 'chokepoints' && <ChokepointPage {...common} id={route.arg} clusters={clusters} setChoke={openChoke} />}
              {route.page === 'routes' && <RoutePlanner {...common} routes={routes} onCompute={computeRoute} />}
              {route.page === 'intel' && <IntelPage intel={intel} openChoke={openChoke} onIngest={ingest} ingesting={ingesting} online={online} />}
              {route.page === 'markets' && <MarketsPage markets={markets} ticker={ticker} onIngest={ingest} ingesting={ingesting} online={online} />}
              {route.page === 'goods' && <GoodsPage data={clusters} k={k} setK={setK} chokes={chokes} />}
              {route.page === 'ai' && <AIPage health={health} intel={intel} chokes={chokes} signals={signals} clusters={clusters} routes={routes} />}
            </main>
            <footer className="border-t hair px-5 lg:px-8 lg:pr-40 py-5 flex flex-col md:flex-row md:items-center md:justify-between gap-2 text-[12px] muted">
              <span>Global Chain AI · AI agent for maritime chokepoint risk</span>
              <span>Educational project. Not for navigation or trading decisions.</span>
            </footer>
          </div>
          <Copilot online={online} open={chatOpen} setOpen={setChatOpen} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (document.getElementById('root').children.length) return;
        var missing = [];
        if (!window.React) missing.push('React 18.3.1');
        if (!window.ReactDOM) missing.push('ReactDOM 18.3.1');
        if (!window.Babel) missing.push('Babel standalone');
        var box = document.getElementById('boot-error');
        box.style.display = 'block';
        box.innerHTML = '<strong>The dashboard could not start.</strong><br>' + (missing.length
          ? 'These libraries did not load from the CDN: ' + missing.join(', ') + '. Check your internet connection and reload.'
          : 'A script error stopped the page. Open the browser console for details.');
      }, 4000);
    });
  </script>
</body>
</html>
