                <button className="btn btn-primary" type="submit" disabled={busy || !input.trim() || online === false}>Send</button>
              </form>
            </div>
          )}

          <button onClick={() => setOpen((v) => !v)} aria-label={open ? 'Close chat' : 'Open chat'}
            className="fixed z-[1300] right-4 sm:right-6 bottom-6 w-14 h-14 rounded-full flex items-center justify-center bg-[#E5E7EB] text-[#0B0F17] hover:bg-white transition-colors"
            style={{ boxShadow: '0 10px 28px rgba(0,0,0,0.45)' }}>
            {open ? <CloseIcon size={22} /> : <ChatIcon size={24} />}
          </button>
        </>
      );
    }

    // =====================================================================
    // COMMODITY CLUSTERS (K-MEANS)
    // =====================================================================
    const CLUSTER = {
      HIGH_SYSTEMIC_RISK: { label: 'High risk', tone: 't-crit', color: '#EF4444' },
      ELEVATED_WATCH: { label: 'Watch', tone: 't-elev', color: '#F59E0B' },
      STABLE_NORMAL_FLOW: { label: 'Stable', tone: 't-safe', color: '#10B981' },
    };

    function Scatter({ data }) {
      const W = 420, H = 300, m = { l: 40, r: 16, t: 16, b: 36 };
      const sx = (v) => m.l + (v / 100) * (W - m.l - m.r);
      const sy = (v) => H - m.b - (v / 100) * (H - m.t - m.b);
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Goods by price swings and supply strain">
          {[0, 25, 50, 75, 100].map((g) => (
            <g key={g}>
              <line x1={sx(g)} x2={sx(g)} y1={m.t} y2={H - m.b} stroke="rgba(255,255,255,0.05)" />
              <line x1={m.l} x2={W - m.r} y1={sy(g)} y2={sy(g)} stroke="rgba(255,255,255,0.05)" />
              <text x={sx(g)} y={H - m.b + 16} textAnchor="middle" fontSize="10" fill="#6B7280" fontFamily="JetBrains Mono">{g}</text>
              <text x={m.l - 8} y={sy(g) + 3} textAnchor="end" fontSize="10" fill="#6B7280" fontFamily="JetBrains Mono">{g}</text>
            </g>
          ))}
          <text x={(W + m.l) / 2} y={H - 4} textAnchor="middle" fontSize="11" fill="#9CA3AF">Price swings</text>
          <text x={12} y={(H - m.b + m.t) / 2} textAnchor="middle" fontSize="11" fill="#9CA3AF" transform={`rotate(-90 12 ${(H - m.b + m.t) / 2})`}>Supply strain</text>
          {data.commodities.map((c) => {
            const cl = data.clusters.find((k) => k.label === c.cluster);
            const col = CLUSTER[c.cluster].color;
            return (
              <g key={c.code}>
                {cl && <line x1={sx(c.volatility)} y1={sy(c.stress)} x2={sx(cl.centroid[0])} y2={sy(cl.centroid[1])} stroke={col} strokeOpacity="0.2" />}
                <circle cx={sx(c.volatility)} cy={sy(c.stress)} r="4.5" fill={col} fillOpacity="0.9" stroke="#111827" strokeWidth="1">
                  <title>{`${c.name}: price swings ${c.volatility}, supply strain ${c.stress}`}</title>
                </circle>
                <text x={sx(c.volatility) + 7} y={sy(c.stress) + 3.5} fontSize="10" fill="#9CA3AF" fontFamily="JetBrains Mono">{c.code}</text>
              </g>
            );
          })}
          {data.clusters.map((k) => {
            const x = sx(k.centroid[0]), y = sy(k.centroid[1]), col = CLUSTER[k.label].color;
            return (
              <g key={k.label}>
                <line x1={x - 7} x2={x + 7} y1={y} y2={y} stroke={col} strokeWidth="2" />
                <line x1={x} x2={x} y1={y - 7} y2={y + 7} stroke={col} strokeWidth="2" />
              </g>
            );
          })}
        </svg>
      );
    }

    function Commodities({ data, k, setK }) {
      const rows = data ? [...data.commodities].sort((a, b) => (b.volatility + b.stress) - (a.volatility + a.stress)) : [];
      return (
        <Section id="commodities" title="Goods at risk"
          description="Key goods and freight grouped by how much their prices are swinging (from market data) and how strained their supply is, given the risk at the passages their cargo uses."
          actions={<div className="seg">{[2, 3].map((n) => <button key={n} className={k === n ? 'on' : ''} onClick={() => setK(n)}>{n} groups</button>)}</div>}>
          {!data && <div className="card p-10 text-center text-sm text-gray-500">Loading…</div>}
          {data && (
            <>
              <div className={`grid grid-cols-1 ${data.clusters.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-6`}>
                {data.clusters.map((cl) => (
                  <div key={cl.label} className="card p-6 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className={`chip ${CLUSTER[cl.label].tone}`}>{CLUSTER[cl.label].label}</span>
                      <span className="text-xs text-gray-500">{cl.size} items</span>
                    </div>
                    <div className="text-sm text-gray-300">{cl.members.join(', ')}</div>
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-1 lg:grid-cols-[1.3fr_1fr] gap-6">
                <div className="card overflow-hidden">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-left text-xs text-gray-500 border-b divider">
                        <th className="font-medium px-6 py-3">Item</th>
                        <th className="font-medium px-4 py-3">Group</th>
                        <th className="font-medium px-4 py-3 text-right">Price swings</th>
                        <th className="font-medium px-4 py-3 text-right">Supply strain</th>
                        <th className="font-medium px-6 py-3 text-right" title="Chance that at least one passage on this item's sea routes is disrupted (noisy-OR)">Supply hit</th>
                      </tr>
                    </thead>
                    <tbody>
                      {rows.map((c) => (
                        <tr key={c.code} className="border-b divider last:border-0">
                          <td className="px-6 py-3 text-gray-200">{c.name}</td>
                          <td className="px-4 py-3"><span className="inline-flex items-center gap-2 text-xs text-gray-400"><span className="chip-dot" style={{ background: CLUSTER[c.cluster].color }} />{CLUSTER[c.cluster].label}</span></td>
                          <td className="px-4 py-3 text-right mono text-gray-300">{c.volatility.toFixed(1)}</td>
                          <td className="px-4 py-3 text-right mono text-gray-300">{c.stress.toFixed(1)}</td>
                          <td className="px-6 py-3 text-right mono text-gray-300">{c.supply_hit_probability != null ? `${(c.supply_hit_probability * 100).toFixed(0)}%` : '--'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="card p-6 space-y-4">
                  <Scatter data={data} />
                  <p className="text-xs text-gray-500 leading-relaxed">{data.data_note} Grouping: k-means, silhouette <span className="mono">{data.silhouette}</span>.</p>
                </div>
              </div>
            </>
          )}
        </Section>
      );
    }

    // =====================================================================
    // APP
    // =====================================================================
    function App() {
      const [online, setOnline] = useState(null);
      const [health, setHealth] = useState(null);
      const [graph, setGraph] = useState(null);
      const [chokes, setChokes] = useState(null);
      const [intel, setIntel] = useState(null);
      const [ingesting, setIngesting] = useState(false);
      const [clusters, setClusters] = useState(null);
      const [k, setK] = useState(2);
      const [routes, setRoutes] = useState(null);
      const [focus, setFocus] = useState(null);
      const [chatOpen, setChatOpen] = useState(false);
      const [signals, setSignals] = useState(null);
      const [markets, setMarkets] = useState(null);
      const lastRouteReq = useRef(null);
      const kRef = useRef(2);

      const ping = useCallback(async () => {
        try { setHealth(await api('/api/health', {}, 6000)); setOnline(true); return true; }
        catch { setOnline(false); return false; }
      }, []);
      const loadChokes = useCallback(async () => { try { setChokes((await api('/api/chokepoints')).chokepoints); } catch {} }, []);
      const loadClusters = useCallback(async (kk) => { try { setClusters(await api(`/api/clusters?k=${kk ?? kRef.current}`)); } catch {} }, []);
      const loadIntel = useCallback(async () => { try { setIntel(await api('/api/intelligence')); } catch {} }, []);
      const loadGraph = useCallback(async () => { try { setGraph(await api('/api/graph')); } catch {} }, []);
      const loadSignals = useCallback(async () => { try { setSignals(await api('/api/signals')); } catch {} }, []);
      const loadMarkets = useCallback(async () => { try { setMarkets(await api('/api/markets')); } catch {} }, []);

      const computeRoute = useCallback(async (start, end, override) => {
        const qs = new URLSearchParams({ start, end, override: override || '' });
        const data = await api(`/api/routes?${qs.toString()}`);
        lastRouteReq.current = { start, end, override };
        setRoutes(data);
        return data;
      }, []);

        const bootstrap = useCallback(async () => {
        if (!(await ping())) return;
        await Promise.all([loadGraph(), loadChokes(), loadIntel(), loadClusters(), loadSignals(), loadMarkets()]);
      }, [ping, loadGraph, loadChokes, loadIntel, loadClusters, loadSignals, loadMarkets]);

      useEffect(() => { bootstrap(); }, [bootstrap]);

        useEffect(() => {
        const t = setInterval(async () => {
          const wasDown = online === false || !graph;
          const ok = await ping();
          if (ok && wasDown) bootstrap();
        }, 20000);
        return () => clearInterval(t);
      }, [online, graph, ping, bootstrap]);

      useEffect(() => { kRef.current = k; loadClusters(k); }, [k, loadClusters]);

      const ingest = useCallback(async () => {
        setIngesting(true);
        try {
          setIntel(await api('/api/intelligence/ingest', { method: 'POST' }, 150000));
          await Promise.all([loadChokes(), loadClusters(), loadSignals(), loadMarkets(), ping()]);
          if (lastRouteReq.current) {
            const { start, end, override } = lastRouteReq.current;
            try { await computeRoute(start, end, override); } catch {}
          }
        } catch { setOnline(false); }
        setIngesting(false);
      }, [loadChokes, loadClusters, loadSignals, loadMarkets, ping, computeRoute]);

      const selectChoke = useCallback((id) => {
        setFocus(id);
        document.getElementById('routing')?.scrollIntoView({ behavior: 'smooth' });
      }, []);

      return (
        <div className="min-h-screen">
          <Header online={online} intel={intel} onAsk={() => setChatOpen(true)} />
          <main className="max-w-7xl mx-auto py-10 px-6 space-y-16">
            {online === false && (
              <div className="card px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-[rgba(239,68,68,0.3)]">
                <div>
                  <div className="text-sm font-medium text-[#FCA5A5]">Can't reach the server</div>
                  <div className="text-sm text-gray-400 mt-1">Start it by running <span className="mono text-gray-200">python backend.py</span>, then open <span className="mono text-gray-200">http://localhost:8000</span>.</div>
                </div>
                <button className="btn" onClick={bootstrap}>Retry</button>
              </div>
            )}
            <Overview chokes={chokes} intel={intel} onSelect={selectChoke} />
            <Section id="routing" title="Map, live ships and routes"
              description="Live AIS ship positions, passage traffic compared with normal, and the risk at each hotspot. Click a ship or hotspot for details, switch base maps and layers on the left, or open the global AIS and weather maps in the tabs. Pick two ports below to compare the safest route with the fastest one.">
              <MapPanel graph={graph} chokes={chokes} routes={routes} focus={focus} setFocus={setFocus} signals={signals} online={online} />
              <RoutePlanner graph={graph} routes={routes} onCompute={computeRoute} online={online} />
            </Section>
            <Signals signals={signals} />
            <Intelligence intel={intel} ingesting={ingesting} onIngest={ingest} onTarget={selectChoke} online={online} />
            <Markets markets={markets} />
            <Commodities data={clusters} k={k} setK={setK} />
          </main>
          <footer className="border-t divider">
            <div className="max-w-7xl mx-auto px-6 pr-24 py-8 flex flex-col md:flex-row md:items-center md:justify-between gap-2 text-xs text-gray-500">
              <span>Global Chain AI</span>
              <span>For demonstration only. Not for navigation.</span>
            </div>
          </footer>
          <ChatWidget online={online} open={chatOpen} setOpen={setChatOpen} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childNodes.length > 0) return;
        var missing = [];
        if (!window.React) missing.push('React 18.3.1');
        if (!window.ReactDOM) missing.push('ReactDOM 18.3.1');
        if (!window.L) missing.push('Leaflet 1.9.4');
        if (!window.Babel) missing.push('Babel standalone 7.24.7');
        if (!window.tailwind) missing.push('Tailwind CSS');
        var box = document.getElementById('boot-error');
        box.style.display = 'block';
        box.innerHTML = '<div style="color:#F9FAFB;font-weight:600;margin-bottom:8px">The dashboard could not start</div>' +
          (missing.length ? 'These libraries did not load: ' + missing.join(', ') + '. Check the internet connection or any network filter blocking unpkg.com or cdn.tailwindcss.com.' :
            'The libraries loaded but the app did not mount. Open the browser console (F12) to see the error.');
      }, 3500);
    });
  </script>
</body>
</html>
